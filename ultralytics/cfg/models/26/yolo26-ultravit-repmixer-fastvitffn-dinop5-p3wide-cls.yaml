# Lane A classifier twin of yolo26-ultravit-repmixer-fastvitffn-dinop5-p3wide.yaml, rows 0-8 match.

nc: 1000

scales:
  # [depth, width, max_channels]
  n: [0.20, 0.25, 1024]
  s: [0.20, 0.50, 1152]
  m: [0.25, 1.00, 512]
  l: [0.24, 1.00, 768]
  x: [0.36, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 P1/2 stem
  - [-1, 1, Conv, [96, 3, 2]] # 1 P2/4 stem
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]] # 2 stage1 P2/4
  - [-1, 1, Conv, [192, 3, 2]] # 3 P3/8 downsample
  - [-1, 8, RepUltraViTBlock, [6, True, 0.00001, True]] # 4 stage2 P3/8
  - [-1, 1, Conv, [384, 3, 2]] # 5 P4/16 downsample
  - [-1, 16, RepUltraViTBlock, [3, True, 0.00001, True]] # 6 stage3 P4/16
  - [-1, 1, Conv, [1152, 3, 2]] # 7 P5/32 downsample
  - [-1, 7, MHSABlock, [0, 4, True, 0.00001, False, 64, False, True, True, True, 4]] # 8 stage4 P5/32 dinop5

# Head
head:
  - [-1, 1, Classify, [nc]] # 9 AdaptiveAvgPool + Conv1x1 + Linear
