# S-only narrow P4-deep arm in the 010826-1 style with the production detector head unchanged.
# Attn2-S widths through P4, P2/P3/P5 block params match YOLO26-S within 2%, P4 raised to 527K
# (conv 346K, attn2 938K). FFN ratios picked so hiddens are multiples of 8 for fp16 tensor cores,
# and the P5 MHSA FFN 0.625 holds the 1380K stage budget at width 512.

nc: 80
end2end: True
reg_max: 1

scales:
  s: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [48, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.171875, True, 0.00001, True]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.5, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [1.25, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 0.625, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
