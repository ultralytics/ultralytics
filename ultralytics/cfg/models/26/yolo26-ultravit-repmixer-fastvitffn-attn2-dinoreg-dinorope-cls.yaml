# Positional-encoding arm over the attn2-dinoreg baseline.
# P5 attention uses DINOv3 axial 2D RoPE, with fixed patch-center phases.
# Every other setting is held at the dinoreg control, so positional encoding is the only
# variable. Storage tokens carry no patch position, so RoPE2DBlock leaves their K/V prefix
# unrotated.
#
# Lane B P5 hybrid. Retains the Attn2 ConvFFN and depth, with DINO-style qkv/proj biases,
# four per-block storage tokens, and 64-wide heads.
# Family s-x. Scale n is unsupported: head_dim 64 does not divide n's 288-wide P5.

nc: 1000

scales:
  s: [0.20, 0.50, 1152]
  m: [0.25, 1.00, 512]
  l: [0.35, 1.00, 512]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 8, DINOv3RoPE2D, [0, 4, True, 0.00001, True, 64, True, True, False, 4]]

head:
  - [-1, 1, Classify, [nc]]
