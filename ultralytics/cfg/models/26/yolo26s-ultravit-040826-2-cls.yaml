# Classifier twin of yolo26s-ultravit-040826-2, backbone identical.

nc: 1000

scales:
  s: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [1.25, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 1.5, True, 0.00001, False, 64]]

head:
  - [-1, 1, Classify, [nc]]
