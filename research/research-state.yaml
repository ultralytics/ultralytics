# Research State — YOLOPose-3D

project:
  title: "YOLOPose-3D — distilling SAM 3D Body into a single-shot YOLO task"
  question: >
    How much of SAM 3D Body's single-image 3D human capability survives compression into one YOLO forward
    pass, and which part of it breaks first?
  status: active
  started: "2026-09-16"
  domain: "monocular 3D human pose / mesh recovery, real-time detection"
  repo: "/home/rick/ultralytics_pose3d (branch pose3d, forked from upstream main fa39b69cb, 8.4.153)"

literature:
  key_papers:
    - id: "sam3dbody2026"
      title: "SAM 3D Body: Robust Full-Body Human Mesh Recovery"
      authors: "Meta Superintelligence Labs"
      year: 2026
      arxiv: "2602.15989"
      relevance: "The teacher. MHR parametric rig, promptable, crop-based, one person at a time."
    - id: "fastsam3dbody2026"
      title: "Fast SAM 3D Body: Accelerating SAM 3D Body for Real-Time Full-Body Human Mesh Recovery"
      year: 2026
      arxiv: "2603.15603"
      relevance: >
        Closest prior art and the reason the gap is detector-shaped: training-free 10.9x speedup, but still
        crop-based, so cost still scales with the number of people.
    - id: "sathmr2025"
      title: "SAT-HMR: Real-Time Multi-Person 3D Mesh Estimation via Scale-Adaptive Tokens"
      year: 2025
      arxiv: "2411.19824"
      relevance: "One-stage real-time multi-person baseline to beat on throughput."
    - id: "multihmr2_2026"
      title: "Multi-HMR 2: Multi-Person Camera-Centric Human Detection, Mesh Recovery and Tracking"
      year: 2026
      arxiv: "2606.14841"
      relevance: "Camera-centric output contract matches ours; reports a YOLO11m-Pose 2D front-end baseline."
    - id: "anthropometric2026"
      title: "Investigating Anthropometric Fidelity in SAM 3D Body"
      year: 2026
      arxiv: "2601.06035"
      relevance: "Bounds the teacher: its bias becomes the student's ceiling."
  open_problems:
    - "No published detector-native (single-shot, anchor-free, edge-exportable) metric 3D human pose head."
    - "Real-time 3D HMR work is either DETR/ViT one-stage at server cost or an acceleration of a crop model."
  evidence_gaps:
    - "Nobody has measured how much 3D accuracy is lost by moving from a per-crop ViT to a shared detector trunk."

hypotheses:
  - id: H0
    statement: "A 4th keypoint channel can carry metric depth through YOLO's existing pose plumbing, train and export."
    status: supported
    motivation: "Cheapest possible wiring; if it needed a parallel head the whole premise gets more expensive."
    evidence: "2026-09-16 smoke: trains, validates with 3D metrics, reloads as task=pose3d, exports to ONNX (1,77,2100)."
    priority: done
  - id: R0
    statement: "Warm-starting from yolo26-pose (2D) beats training pose3d from scratch, as it did for s3d."
    status: pending
    motivation: "s3d saw 34.3 -> 52.0 AP3D from pretrained backbone + long schedule. Cheap to test, large prior."
    priority: high
  - id: H1
    statement: >
      A pose3d student distilled from SAM 3D Body reaches usable real-GT MPJPE at an order of magnitude more
      throughput, and its error is dominated by root depth rather than by root-relative pose.
    status: pending
    motivation: "The core question. The split matters: relative pose is a shape problem, root depth is a scale problem."
    priority: high
  - id: H2
    statement: "Scale-changing augmentation (mosaic, scale) degrades metric root depth; compensating the target fixes it."
    status: pending
    motivation: >
      Apparent size is the monocular depth cue; resizing the crop changes the cue without changing the label.
      The depth task hit this. Cheap A/B.
    priority: high
  - id: H3
    statement: "Decoupling root depth from root-relative depth beats regressing absolute per-joint depth."
    status: pending
    motivation: >
      One regressor would have to cover both a 1-40 m range and a +/-0.5 m range. Implemented as the decoupled
      arm already; the absolute arm is the A/B.
    priority: medium
  - id: H4
    statement: "Regressing MHR parameters (mesh) beats regressing joints, once joints work."
    status: deferred
    motivation: "It is what the teacher outputs, but it drags a gated rig asset into an AGPL inference path."
    priority: low
  - id: H5
    statement: "Body-scale-normalized relative depth trains better than metres."
    status: pending
    motivation: "Children and adults differ; normalizing removes a nuisance variable and is trivially invertible."
    priority: low

experiments:
  proxy_metric: >
    Inner loop: MPJPE (mm) against held-out SAM 3D Body pseudo-labels (teacher agreement), minutes to compute.
    Outer loop: MPJPE / PA-MPJPE on a real-GT benchmark, plus root AbsRel and ms/person.
  baseline_value: null
  best_value: null
  total_runs: 0
  trajectory: []

open_tasks:
  - id: T1
    text: "Provision SAM 3D Body on an ultra host: gated HF checkpoints + its detectron2-pinned install."
    status: done
    blocking: "Closed 2026-09-16 without a download — already installed on ultra11 (/data/rick/sam3d)."
  - id: T2
    text: "Acquire one real-GT 3D benchmark (3DPW preferred, else EMDB/AGORA/BEDLAM)."
    status: done
    blocking: "Closed 2026-09-16. 3DPW test is the benchmark; train+validation joined the training set 2026-09-22."
  - id: T3
    text: "Pseudo-label a COCO person subset and build the first real pose3d dataset."
    status: done
    blocking: "Closed 2026-09-16, and un-halved 2026-09-22: 56,599 images now load, not 29,344."
  - id: T4
    text: "Finish the BEDLAM 1.0 download and write research/src/convert_bedlam.py."
    status: in_progress
    blocking: >
      H1 and H5. BEDLAM is the only source with exact metric depth AND per-frame intrinsics at scale, which is
      what root depth needs and what no pseudo-label can supply. Pulling ~380 GB (6fps + AGORA) from the ungated
      hf-mirror copy nguyenquivinhquang/BEDLAM at ~5 MB/s into /data/shared-datasets/bedlam-rick on ultra15.
      The converter is the real work, not the download: BEDLAM ships per-frame intrinsics, so each frame's depth
      must be re-keyed onto the declared focal = 1.2 * max(w, h) at write time, exactly as refocal_labels.py does
      for COCO. A naive converter would make it a fourth focal convention in one pipeline — see H6.
      Provenance to settle before publication: this copy is a third-party mirror, so MPI's licence was never
      accepted. It does not block the experiments, but a paper using it needs the licence question answered.
  - id: T6
    text: "Pseudo-label the Objects365v1 person subset (608,253 labelled images, class 0 = person)."
    status: in_progress
    blocking: >
      Nothing — launched 2026-09-22 on ultra15 GPUs 0/1/3, three shards, writing /home/rick/objects365-pose3d.
      Resumable: the labeller skips any image whose output label already exists, so it can be killed and
      relaunched freely. This is new imagery, not a re-annotation, which is why it was chosen over sama-coco
      (same COCO pixels, already pseudo-labelled — no new information). Read T5 before believing its numbers.
  - id: T5
    text: "Retrain on the recovered full COCO + 3DPW before acquiring any more pseudo-label source imagery."
    status: pending
    blocking: >
      This is the gate on Tier-4 data (Objects365/sama-coco person crops, already on disk, no download needed).
      H7 attributes the 2D gap to the dropped images (now fixed) plus annotator convention (which more teacher
      labels make worse, not better). If the gap does not close and depth does not move on this run, volume and
      scene diversity become the next lever; if it does, more pseudo-labels are the wrong spend.

