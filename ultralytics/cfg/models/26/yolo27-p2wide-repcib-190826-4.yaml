# YOLO27-N P3 detector with wider P2 detail injection and deeper reparameterized P3 context.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  # Adapted from SNI Section 3.2 and source lines 24-36: damp the upsampled semantic map before fusion.
  # This ablation uses 0.5 instead of SNI's 1 / up_factor^2 to retain more P5 context.
  # https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/08386.pdf#page=6
  # https://github.com/alanli1997/rethinking-fpn/blob/a7c5ba02a54a4b39c620b56f85b4d89233515c37/slimneck_v2/for_yolo/sn2-yolov5-v8/ultralytics/nn/modules.py#L24-L36
  - [-1, 1, Scale, [0.5]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  # Fixed-cost EFS adaptation: project the backbone's P2 map into P3 rather than adding a P2 Detect head.
  # DM-EFS Figure 2 adds shallow high-resolution features. SR-TOD Section 3.1 identifies P2 as its tiny-object interface.
  # https://openaccess.thecvf.com/content/ICCV2025/papers/Sharma_DM-EFS_Dynamically_Multiplexed_Expanded_Features_Set_Form_for_Robust_and_ICCV_2025_paper.pdf#page=2
  # https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/02515.pdf#page=6
  - [2, 1, Conv, [128, 3, 2]]
  - [14, 1, nn.Upsample, [None, 2, "nearest"]]
  # Apply the same SNI-inspired 0.5 damping before the P4-to-P3 fusion.
  - [-1, 1, Scale, [0.5]]
  - [[-1, 4, 15], 1, Concat, [1]]
  # Adapted from YOLOv10 CIB lines 702-768: lk=True inserts a fuseable parallel 7x7/3x3 depthwise kernel.
  # This arm moves that block from YOLOv10n's P5 (config lines 36-38) to P3 to recover context after P2 injection.
  # https://github.com/THU-MIG/yolov10/blob/453c6e38a51e9d1d5a2aa5fb7f1014a711913397/ultralytics/nn/modules/block.py#L702-L768
  # https://github.com/THU-MIG/yolov10/blob/453c6e38a51e9d1d5a2aa5fb7f1014a711913397/ultralytics/cfg/models/v10/yolov10n.yaml#L36-L38
  - [-1, 3, C2fCIB, [512, True, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[19, 22, 25], 1, Detect, [nc]]
