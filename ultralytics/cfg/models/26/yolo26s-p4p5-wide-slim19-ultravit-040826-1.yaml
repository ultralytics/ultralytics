# YOLO26-S detector with the UltraViT-S 040826-1 backbone and p4p5-wide-slim19 neck/head.

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  s: [0.20, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [2.125, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 0.625, True, 0.00001, False, 64]]

# p4p5-wide-slim19 neck/head: P3 context path and Detect(P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [384, True]]

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [640, True]]

  - [-1, 1, Conv, [640, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  - [[17, 20], 1, Detect, [nc]]
