# YOLO27-S with local P2 detail and residual-safe selective P5 context.

nc: 80
end2end: True
reg_max: 1
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  # Keep the P2 path local: matched O365 trajectories favor plain P2 detail over context-gated P2.
  - [2, 1, Conv, [64, 3, 2]]
  - [14, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 4, 15], 1, Concat, [1]]
  - [-1, 3, C3k2, [384, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  # Restore learned P5 fusion before context. LSKNet projects each stage before applying same-channel LSK blocks.
  - [-1, 1, C3k2, [768, True]]
  # LSKNet Sections 3.2-3.3 and source lines 35-104: apply selective large-kernel context only after channel
  # alignment, retaining the source attention wrapper's residual path for Medium/Large recognition.
  # https://openaccess.thecvf.com/content/ICCV2023/papers/Li_Large_Selective_Kernel_Network_for_Remote_Sensing_Object_Detection_ICCV_2023_paper.pdf#page=4
  # https://github.com/zcablii/LSKNet/blob/8214a95cf782a4361cbec5368f4921e37785575e/mmrotate/models/backbones/lsknet.py#L35-L104
  - [-1, 1, LSKAttention, [768]]
  - [-1, 1, Conv, [1024, 1, 1]]
  - [[19, 22, 27], 1, Detect, [nc]]
