# n-020826-1 with the P3 C3k2 widened, e 0.25 -> 0.5 (P3 stage 63K -> 107K). AP_small is the largest relative
# gap to conv publ-inet at every scale (N -13%, S -6.7%, M -9.2%) while P5 attention already wins large at L,
# so the 4% latency headroom goes to the small-object path. P3 width at N benched near free (p3wide ~-9.5%
# vs conv, 8/8) where the P4 FFN widening of n-040826-1 cost +5.4% and failed the gate. P4 and P5 stay 020826-1.

nc: 80
end2end: True
reg_max: 1

scales:
  n: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, C3k2, [128, False, 0.5]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [1.25, True, 0.00001, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, MHSABlock, [0, 3.8125, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [64, True]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
