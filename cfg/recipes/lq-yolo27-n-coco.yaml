# COCO fine-tune port of LQ's yolo27n-d-c3k2-muon-fix-300-cls-2 recipe.
# The shipped YOLO26-N checkpoint carries the same supported optimizer, loss, and augmentation values.
_shipped_from: yolo26{size}.pt
_epochs_by_scale: { n: 300 }
backbone_lr_ratio: 1.0
batch: 128
close_mosaic: 10
end2end: true
grad_clip: 1.0
imgsz: 640
kobj: 1.0
optimizer: MuSGD
patience: 100
pose: 12.0
workers: 4
