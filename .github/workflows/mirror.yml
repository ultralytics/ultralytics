name: Restore GitLab profile banner (one time)
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  profiles:
    if: github.repository == 'ultralytics/ultralytics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore GitLab profile README banner
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import urllib.parse
          token = os.environ["GITLAB_TOKEN"]
          def gitlab(endpoint, method="GET", avatar=None, **data):
              body = json.dumps(data).encode() if data else None
              content_type = "application/json"
              if avatar is not None:
                  boundary = "ultralytics-avatar"
                  content_type = f"multipart/form-data; boundary={boundary}"
                  body = (
                      f'--{boundary}\r\nContent-Disposition: form-data; name="avatar"; filename="logo.png"\r\n'
                      'Content-Type: image/png\r\n\r\n'
                  ).encode() + avatar + f"\r\n--{boundary}--\r\n".encode()
              request = urllib.request.Request(
                  f"https://gitlab.com/api/v4/{endpoint}",
                  data=body,
                  headers={"PRIVATE-TOKEN": token, "Content-Type": content_type},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return None if response.status == 204 else json.load(response)


          import base64
          import re
          source = urllib.request.urlopen("https://raw.githubusercontent.com/ultralytics/ultralytics/main/README.md", timeout=60).read().decode()
          banner = re.search(r'<a href="([^"]+)"[^>]*>\s*(<img[^>]+alt="Ultralytics YOLO banner"[^>]*>)', source)
          assert banner, "Source banner not found"
          endpoint = "projects/54400893"
          project = gitlab(endpoint)
          file = gitlab(f"{endpoint}/repository/files/README.md?ref={project['default_branch']}")
          before = base64.b64decode(file["content"]).decode()
          assert before.startswith('<p align="center">')
          header = f'<p align="center">\n  <a href="{banner[1]}">\n    {banner[2]}\n  </a>\n</p>'
          after = header + before[before.index("</p>") + len("</p>"):]
          branch = "automation/restore-profile-banner"
          commit = gitlab(f"{endpoint}/repository/commits", "POST", branch=branch, start_branch=project["default_branch"],
              commit_message="Restore Ultralytics README banner on GitLab profile",
              actions=[{"action":"update", "file_path":"README.md", "content":after, "last_commit_id":file["last_commit_id"]}])
          mr = gitlab(f"{endpoint}/merge_requests", "POST", source_branch=branch, target_branch=project["default_branch"],
              title="Restore Ultralytics README banner on GitLab profile",
              description="Use the same banner image, destination link, and full-width presentation as the current Ultralytics README. Preserve the refreshed profile text and links.", remove_source_branch=True)
          print("Review:", mr["web_url"], "head:", commit["id"])
