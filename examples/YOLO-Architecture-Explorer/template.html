<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>YOLO Architecture Explorer</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
        <style>
            :root {
                --bg: #f4f6f9;
                --panel: #ffffff;
                --ink: #1b2130;
                --muted: #5d6677;
                --faint: #8a93a3;
                --line: #dde2ea;
                --accent: #2d6cdf;
                --accent-soft: #e5eefc;
                --edge: #4b5563;
                --edge-hi: #2563eb;
                --label-bg: #ffffffee;
                --code-bg: #f6f8fb;
                --new: #d9480f;
                --conv: #8fd6f5;
                --conv-s: #2b93c9;
                --csp: #fde9a6;
                --csp-s: #d9a520;
                --unit: #f7c1a7;
                --unit-s: #d27a52;
                --pool: #74acee;
                --pool-s: #2563c7;
                --down: #8ee0c6;
                --down-s: #1f9a78;
                --up: #a9dc76;
                --up-s: #5b9f2c;
                --concat: #f8c243;
                --concat-s: #c98a00;
                --attn: #cfbbf7;
                --attn-s: #7a52cf;
                --head: #cbe58c;
                --head-s: #79a028;
                --norm: #dde3ea;
                --norm-s: #7f8a99;
                --prim: #f8c8a6;
                --prim-s: #d4834d;
                --bn: #bfe5a6;
                --bn-s: #5e9f3c;
                --act: #c6eef3;
                --act-s: #3aa3b5;
                --op: #ffe2c2;
                --op-s: #d9822b;
                --split: #cfe9a9;
                --split-s: #6aa33a;
                --fn: #dfe6f7;
                --fn-s: #4f64a8;
                --seq: #cfe9fb;
                --seq-s: #2b93c9;
                --io: #ffffff;
                --io-s: #4b5563;
                --node-ink: #111827;
                --node-sub: #374151;
                --label-ink: #1f2937;
                --tok-w: #c2410c;
                --tok-d: #1d4ed8;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #0e1117;
                    --panel: #151a22;
                    --ink: #e7eaf0;
                    --muted: #a0a9b8;
                    --faint: #707a8a;
                    --line: #283040;
                    --accent: #6ea1ff;
                    --accent-soft: #1b2a45;
                    --edge: #a3adbd;
                    --edge-hi: #6ea1ff;
                    --label-bg: #151a22f0;
                    --label-ink: #e5e7eb;
                    --tok-w: #fb923c;
                    --tok-d: #93c5fd;
                    --code-bg: #10141b;
                    --new: #ff8a50;

                }
            }
            :root[data-theme="dark"] {
                --bg: #0e1117;
                --panel: #151a22;
                --ink: #e7eaf0;
                --muted: #a0a9b8;
                --faint: #707a8a;
                --line: #283040;
                --accent: #6ea1ff;
                --accent-soft: #1b2a45;
                --edge: #a3adbd;
                --edge-hi: #6ea1ff;
                --label-bg: #151a22f0;
                    --label-ink: #e5e7eb;
                    --tok-w: #fb923c;
                    --tok-d: #93c5fd;
                --code-bg: #10141b;
                --new: #ff8a50;

            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--bg);
                color: var(--ink);
                font:
                    13px/1.45 system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }
            button,
            select,
            input {
                font: inherit;
                color: inherit;
            }
            select {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 3px 6px;
            }
            .app {
                display: grid;
                grid-template-rows: auto auto 1fr;
                height: 100vh;
            }
            header {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 10px 16px;
                background: var(--panel);
                border-bottom: 1px solid var(--line);
                flex-wrap: wrap;
            }
            header h1 {
                font-size: 15px;
                margin: 0;
                white-space: nowrap;
            }
            header h1 span {
                color: var(--muted);
                font-weight: 400;
                font-size: 12px;
            }
            .tabs {
                display: flex;
                gap: 3px;
                flex-wrap: wrap;
            }
            .tab,
            .chip,
            .btn {
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: 7px;
                padding: 4px 10px;
                cursor: pointer;
                white-space: nowrap;
            }
            .tab:hover,
            .chip:hover,
            .btn:hover {
                border-color: var(--accent);
            }
            .tab.on,
            .chip.on {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .spacer {
                flex: 1;
            }
            .seg {
                display: inline-flex;
                border: 1px solid var(--line);
                border-radius: 7px;
                overflow: hidden;
            }
            .seg button {
                border: 0;
                background: var(--panel);
                padding: 4px 9px;
                cursor: pointer;
                border-right: 1px solid var(--line);
            }
            .seg button:last-child {
                border-right: 0;
            }
            .seg button.on {
                background: var(--accent);
                color: #fff;
            }
            .subbar {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 7px 16px;
                border-bottom: 1px solid var(--line);
                background: var(--panel);
                flex-wrap: wrap;
                min-height: 42px;
            }
            .crumbs {
                display: flex;
                align-items: center;
                gap: 5px;
                flex-wrap: wrap;
            }
            .crumbs a {
                color: var(--accent);
                cursor: pointer;
            }
            .crumbs a:hover {
                text-decoration: underline;
            }
            .crumbs .sep {
                color: var(--faint);
            }
            main {
                display: grid;
                grid-template-columns: 1fr 400px;
                min-height: 0;
            }
            #stage {
                position: relative;
                overflow: hidden;
                min-height: 0;
            }
            #svg {
                width: 100%;
                height: 100%;
                display: block;
                cursor: grab;
                user-select: none;
                touch-action: none;
            }
            #svg.drag {
                cursor: grabbing;
            }
            #evo {
                position: absolute;
                inset: 0;
                overflow: auto;
                padding: 16px;
                display: none;
            }
            .zoom {
                position: absolute;
                right: 12px;
                bottom: 12px;
                display: flex;
                gap: 4px;
            }
            .hint {
                position: absolute;
                left: 12px;
                bottom: 10px;
                right: 150px;
                color: var(--faint);
                font-size: 12px;
                pointer-events: none;
            }
            aside {
                border-left: 1px solid var(--line);
                background: var(--panel);
                overflow: auto;
                padding: 14px 16px 30px;
                min-height: 0;
            }
            aside h2 {
                font-size: 17px;
                margin: 0 0 4px;
            }
            aside h3 {
                font-size: 11.5px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
                margin: 18px 0 6px;
            }
            aside p {
                margin: 6px 0;
            }
            aside a {
                color: var(--accent);
            }
            .muted {
                color: var(--muted);
            }
            .mono {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 12px;
                overflow-wrap: anywhere;
            }
            table {
                border-collapse: collapse;
                width: 100%;
            }
            td,
            th {
                text-align: left;
                padding: 3px 6px;
                border-bottom: 1px solid var(--line);
                vertical-align: top;
            }
            th {
                color: var(--muted);
                font-weight: 500;
                font-size: 12px;
            }
            td.num,
            th.num {
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            .badge {
                display: inline-block;
                font-size: 11px;
                padding: 1px 7px;
                border-radius: 10px;
                border: 1px solid var(--line);
                margin: 0 4px 3px 0;
                white-space: nowrap;
            }
            .badge.new {
                color: var(--new);
                border-color: var(--new);
                font-weight: 600;
            }
            .fam {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 3px;
                margin-right: 6px;
                vertical-align: -1px;
                border: 1px solid;
            }
            pre.code {
                background: var(--code-bg);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px;
                overflow: auto;
                max-height: 460px;
                font-size: 11.5px;
                line-height: 1.5;
                margin: 6px 0;
            }
            .code .k {
                color: #a626a4;
            }
            .code .s {
                color: #3f9142;
            }
            .code .c {
                color: var(--faint);
                font-style: italic;
            }
            .code .n {
                color: #b07800;
            }
            details summary {
                cursor: pointer;
                color: var(--accent);
                margin: 6px 0;
            }
            .legend {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 3px 10px;
                font-size: 12px;
            }
            svg text {
                fill: var(--ink);
            }
            .node {
                cursor: pointer;
            }
            .node rect.box {
                stroke-width: 1.3;
            }
            .node:hover rect.box {
                stroke-width: 2.4;
            }
            .node.sel rect.box {
                stroke: var(--accent) !important;
                stroke-width: 3;
            }
            .node text {
                fill: var(--node-ink);
            }
            .node .t {
                font-weight: 700;
                font-size: 14.5px;
            }
            .node .st {
                font-size: 12px;
                fill: var(--node-sub);
            }
            .node .idx {
                font-size: 13px;
                font-weight: 800;
            }
            .node .pl {
                font-size: 11px;
                fill: var(--node-sub);
            }
            .node.k-input text,
            .node.k-output text {
                fill: #111827;
            }
            .node .xp {
                font-size: 13px;
                fill: var(--accent);
                font-weight: 700;
            }
            .edge path {
                fill: none;
                stroke: var(--edge);
                stroke-width: 1.7;
            }
            .edge path.hit {
                stroke: transparent;
                stroke-width: 12;
            }
            .edge.hi path:not(.hit) {
                stroke: var(--edge-hi);
                stroke-width: 3;
            }
            .edge.dim {
                opacity: 0.15;
            }
            .elab rect {
                fill: var(--label-bg);
            }
            .elab rect {
                stroke: var(--line);
            }
            .elab text {
                font-size: 12px;
                fill: var(--label-ink);
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }
            .edge.hi .elab text {
                fill: var(--edge-hi);
                font-weight: 600;
            }
            .colhdr {
                font-size: 12px;
                font-weight: 700;
                fill: var(--muted);
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }
            .colbg {
                fill: var(--ink);
                opacity: 0.03;
            }
            .vcards {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
                gap: 10px;
                margin-bottom: 18px;
            }
            .vcard {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 10px 12px;
            }
            .vcard h4 {
                margin: 0 0 4px;
                font-size: 14px;
            }
            .vcard p {
                margin: 4px 0 8px;
                color: var(--muted);
                font-size: 12px;
            }
            .vcard .chip {
                font-size: 11.5px;
                padding: 2px 7px;
                margin: 0 4px 4px 0;
                display: inline-block;
            }
            .vcard .cfgs .chip {
                color: var(--muted);
            }
            .matrix {
                border-collapse: separate;
                border-spacing: 0;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 10px;
                width: auto;
            }
            .matrix th,
            .matrix td {
                border-bottom: 1px solid var(--line);
                padding: 4px 9px;
                text-align: center;
            }
            .matrix td:first-child,
            .matrix th:first-child {
                text-align: left;
                position: sticky;
                left: 0;
                background: var(--panel);
            }
            .matrix tr.row {
                cursor: pointer;
            }
            .matrix tr.row:hover td,
            .matrix tr.row.on td {
                background: var(--accent-soft);
            }
            .matrix tr.grp td {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
                text-align: left;
                background: var(--bg);
            }
            .dot {
                display: inline-block;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: var(--accent);
                opacity: 0.7;
                vertical-align: -1px;
            }
            .dot.first {
                background: var(--new);
                opacity: 1;
            }
            .evohead {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 6px 0 10px;
                flex-wrap: wrap;
            }
            .evohead input {
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: 7px;
                padding: 4px 9px;
                width: 220px;
            }
            .warn {
                padding: 30px;
                color: var(--new);
            }
            .node .t.sm {
                font-size: 12.5px;
            }
            .tw {
                fill: var(--tok-w) !important;
                font-weight: 700;
            }
            .td {
                fill: var(--tok-d) !important;
                font-weight: 700;
            }
            .deltatag {
                fill: #e11d48;
            }
            .node .deltatxt,
            .node .onlytxt {
                fill: #fff;
                font-size: 10px;
                font-weight: 800;
            }
            .onlytag {
                fill: #db2777;
            }
            .node rect.box.onlybox {
                stroke: #db2777 !important;
                stroke-width: 2.6;
                stroke-dasharray: 5 3;
            }
            .deltanote {
                color: #e11d48;
                font-weight: 700;
            }
            .seg.phase button.on {
                background: #e11d48;
            }
            ul.notes {
                margin: 6px 0;
                padding-left: 18px;
            }
            ul.notes li {
                margin: 3px 0;
            }
            table.diff td.minus {
                color: #e11d48;
                font-weight: 800;
            }
            table.diff td.plus {
                color: #16a34a;
                font-weight: 800;
            }
            #tip {
                position: absolute;
                z-index: 5;
                pointer-events: none;
                display: none;
                max-width: 380px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 9px;
                box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
                padding: 9px 11px;
                font-size: 12.5px;
            }
            #tip b {
                font-size: 13.5px;
            }
            #tip table {
                margin-top: 5px;
            }
            #tip td,
            #tip th {
                padding: 1px 6px 1px 0;
                font-size: 12px;
            }
            .slab {
                fill: var(--panel);
                stroke: var(--faint);
            }
            .slabtop,
            .slabside {
                fill: var(--norm);
                stroke: var(--faint);
                stroke-width: 1;
            }
            .node.open rect.box {
                stroke: var(--accent) !important;
                stroke-width: 2.6;
                stroke-dasharray: 6 3 !important;
            }
            .edge.ov path {
                stroke-width: 1.1;
                opacity: 0.85;
            }
            .card {
                fill: var(--panel);
                stroke: var(--line);
                stroke-width: 1.2;
                filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.08));
            }
            .cardhdr {
                fill: var(--accent-soft);
            }
            .cardt {
                font-weight: 700;
                font-size: 14px;
            }
            .cards {
                font-size: 11px;
                fill: var(--muted) !important;
            }
            .sbtn {
                cursor: pointer;
            }
            .sbtn rect {
                fill: var(--panel);
                stroke: var(--line);
            }
            .sbtn:hover rect {
                stroke: var(--accent);
            }
            .sbtn.on rect {
                fill: var(--accent);
                stroke: var(--accent);
            }
            .sbtn text {
                font-size: 12px;
            }
            .sbtn.on text {
                fill: #fff;
            }
            .conn {
                fill: none;
                stroke: var(--accent);
                stroke-width: 1.6;
                stroke-dasharray: 6 4;
                opacity: 0.7;
            }
            .band {
                fill: var(--ink);
                opacity: 0.035;
            }
            .bandlbl {
                font-size: 15px;
                font-weight: 700;
                fill: var(--muted) !important;
            }
            .bandsub,
            .ovhint {
                font-size: 11px;
                fill: var(--faint) !important;
            }
            @media (max-width: 900px) {
                main {
                    grid-template-columns: 1fr;
                    grid-template-rows: 62vh auto;
                }
                .app {
                    height: auto;
                }
                aside {
                    border-left: 0;
                    border-top: 1px solid var(--line);
                }
                .hint {
                    display: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="app">
            <header>
                <h1>YOLO Architecture Explorer <span id="meta"></span></h1>
                <div class="seg" id="viewseg">
                    <button data-v="arch" class="on">Architecture</button><button data-v="evo">Blocks &amp; evolution</button>
                </div>
                <div class="tabs" id="vtabs"></div>
                <div class="spacer"></div>
                <button class="btn" id="theme" title="Toggle light / dark">◐</button>
            </header>
            <div class="subbar" id="subbar"></div>
            <main>
                <div id="stage">
                    <svg id="svg"><g id="vp"></g></svg>
                    <div id="evo"></div>
                    <div id="tip"></div>
                    <div class="hint" id="hint">
                        click a block to open its internals · click inside a card to go deeper · hover for numbers ·
                        wheel scrolls, Ctrl/⌘+wheel zooms · drag to pan · Esc closes the last card
                    </div>
                    <div class="zoom">
                        <button class="btn" id="zin" title="Zoom in">+</button
                        ><button class="btn" id="zout" title="Zoom out">−</button
                        ><button class="btn" id="zfit" title="Fit (f)">fit</button>
                    </div>
                </div>
                <aside id="panel"></aside>
            </main>
        </div>
        <script>
            const DATA = /*__DATA__*/null;
            const $ = (s) => document.querySelector(s);
            const esc = (s) =>
                String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
            const NS = "http://www.w3.org/2000/svg";
            const FAM_LABEL = {
                conv: "Convolution",
                down: "Downsampling block",
                csp: "CSP / ELAN block",
                pool: "Spatial pyramid pooling",
                attn: "Attention",
                up: "Upsampling",
                concat: "Concat",
                head: "Detection head",
                unit: "Bottleneck / residual unit",
                seq: "Sequential branch (folded)",
                fn: "Helper method (grouped ops)",
                prim: "Conv2d",
                bn: "BatchNorm",
                act: "Activation",
                split: "Split / chunk",
                op: "Tensor op (from forward)",
                norm: "Other (identity, linear, …)",
                io: "Input / output / constant",
            };
            const TYPE_FAM = {
                Conv2d: "prim",
                BatchNorm2d: "bn",
                LayerNorm: "bn",
                SiLU: "act",
                ReLU: "act",
                GELU: "act",
                Hardswish: "act",
                Sequential: "seq",
            };
            const OP_FAM = { cat: "concat", chunk: "split", split: "split" };
            // pure reshaping: hidden in simple mode, the edge keeps the reshaped shape
            const PLUMB = new Set(["view", "reshape", "permute", "transpose", "flatten", "unsqueeze", "squeeze", "contiguous", "expand", "slice", "detach", "repeat", "float", "to", "clone", "type_as", "expand_as", "view_as"]);
            const OP_DOC = {
                chunk: "Split the tensor into equal chunks along a dim — the 'Split' in C2f-style blocks.",
                split: "Split the tensor into parts of the given sizes along a dim.",
                cat: "Concatenate tensors along a dim (dim 1 = channels for feature maps).",
                add: "Element-wise addition — usually a residual / shortcut connection.",
                add_: "In-place element-wise addition.",
                mul: "Element-wise multiplication (gating, scaling, or multiplying by stride).",
                sub: "Element-wise subtraction.",
                div: "Element-wise division.",
                matmul: "Matrix multiplication (attention scores or attention-weighted values).",
                softmax: "Softmax along a dim (attention weights, or DFL bin probabilities).",
                sigmoid: "Sigmoid — turns class logits into probabilities.",
                view: "Reshape without copying.",
                reshape: "Reshape the tensor.",
                permute: "Reorder dimensions.",
                transpose: "Swap two dimensions.",
                flatten: "Flatten a range of dimensions into one.",
                unsqueeze: "Insert a size-1 dimension.",
                slice: "Index / slice the tensor.",
                detach: "Stop gradients — the one-to-one head trains without back-propagating into the backbone.",
                topk: "Keep the k highest scores (end-to-end post-processing).",
                gather: "Pick rows by index (end-to-end post-processing).",
            };
            const S = {
                phase: "train",
                simple: true,
                view: "arch",
                cfg: null,
                mode: "sym",
                path: [], // full-screen focus on one block (breadcrumb)
                cards: [], // detail cards opened beside the diagram, each one level deeper
                sel: null,
                labels: true,
                evoq: "",
                evoBlock: null,
                focus: null,
            };
            const cfgById = Object.fromEntries(DATA.configs.map((c) => [c.id, c]));
            const fam = (type) => (type.endsWith("()") ? "fn" : TYPE_FAM[type] || DATA.catalog[type]?.family || "csp");
            const famFill = (f) => (f === "head" ? "url(#gHead)" : `var(--${f})`);
            const famStroke = (f) => `var(--${f}-s)`;
            const scaleKeys = (cfg) => Object.keys(cfg.scales);
            const PHASE_LABEL = { train: "Training", deploy: "Deployment" };
            const PHASE_TIP = {
                train: "model.train(): BatchNorm and RepConv branches unfused, every training head runs, raw outputs feed the loss",
                deploy: "model.fuse() + eval(), what predict() / export() run: BN folded, Rep branches merged, unused head removed, outputs decoded",

            const V = (l) => l.variants[S.phase] || []; // a layer's internal structures in the current mode
            const otherPhase = () => (S.phase === "train" ? "deploy" : "train");
            // follow a card chain into another mode: same scales for the layer, then same named block at each level
            function remapChain(chain, cfg) {
                const out = [];
                for (const [i, c] of chain.entries()) {
                    if (i === 0) {
                        if (c.layer == null) return [];
                        const l = cfg.layers[c.layer],
                            old = l.variants;
                        const scales = Object.values(old)
                            .flat()
                            .find(([k]) => k === c.key)?.[1] || [];
                        let vi = V(l).findIndex(([, sc]) => sc.some((x) => scales.includes(x)));
                        if (vi < 0) vi = 0;
                        if (!V(l)[vi]) return [];
                        out.push({ ...c, key: V(l)[vi][0], vi });
                    } else {
                        const prevOld = DATA.blocks[chain[i - 1].key].nodes[c.from ?? c.j];
                        const nb = DATA.blocks[out[i - 1].key].nodes;
                        const j = nb.findIndex((m) => m.g && m.name === prevOld?.name && m.type === prevOld?.type);
                        if (j < 0) break;
                        out.push({ ...c, key: nb[j].g, from: c.from != null ? j : c.from, j: c.j != null ? j : c.j });

            function setPhase(ph) {

            /* ------------------------------------------------------------ helpers */
            function el(tag, attrs = {}, parent) {

                const KW =
                    /\b(def|class|return|if|else|elif|for|in|not|and|or|is|None|True|False|self|super|lambda|with|yield|import|from|as|raise|assert|while)\b/g;

                    .split("\n")

                        const cm = ci >= 0 ? line.slice(ci) : "";

                            .replace(/\b(\d+\.?\d*)\b/g, "\u0003$1\u0004")
                            .replace(KW, "\u0005$1\u0006")
                            .replace(/\u0001/g, '<span class="s">')
                            .replace(/\u0003/g, '<span class="n">')

            /* ------------------------------------------------------------ pan / zoom */
            const svg = $("#svg"),
                vp = $("#vp");
            let T = { x: 0, y: 0, k: 1 },
                bbox = null,
                anim = 0;
            const applyT = () => vp.setAttribute("transform", `translate(${T.x},${T.y}) scale(${T.k})`);
            function viewFor(r, maxK) {
                const v = svg.getBoundingClientRect(),
                    pad = 24;
                const k = Math.max(0.12, Math.min(maxK, (v.width - 2 * pad) / r.w, (v.height - 2 * pad) / r.h));

            function animateTo(t2) {

            /* ------------------------------------------------------------ drawing primitives */

            function drawEdge(g, e) {

            // colour the scale symbols like the reference: w / r orange, d / n blue

            function clear() {

            // split the backbone into parallel chains: a stride reset starts a new chain (e.g. yolov9e's second
            // backbone), layers fed from elsewhere (e.g. CBLinear) go to a links column between the chains
            function splitBackbone(cfg) {
                const L = cfg.layers,
                    nb = cfg.nb;
                const chains = [["in"]],
                    links = [];
                let maxS = 1;
                for (let i = 0; i < nb; i++) {

                    const continued = i + 1 < nb && srcOf(L[i + 1]).includes(i); // a real chain is consumed by the next layer
