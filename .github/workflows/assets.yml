# Builds the one cross-OS CI asset cache that CI and Docker test jobs restore, so they don't download weights and
# datasets from GitHub Releases one by one. It is rebuilt only when the manifest changes.

name: Assets

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      key:
        description: Cache key of the restorable CI assets
        value: ${{ jobs.Assets.outputs.key }}

jobs:
  # Assets live in workspace-relative weights/ and datasets/ because actions/cache rejects '..' paths.
  Assets:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=ci-assets-${{ hashFiles('tests/cache_test_assets.py', 'tests/__init__.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: &asset-paths |
            weights
            datasets
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ultralytics/actions/setup-uv@main
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Download assets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ultralytics/actions/retry@main
        with:
          retries: 2
          retry_delay_seconds: 60
          timeout_minutes: 30
          run: |
            uv pip install -e . "git+https://github.com/ultralytics/CLIP.git" --torch-backend cpu
            yolo settings weights_dir="${GITHUB_WORKSPACE}/weights" datasets_dir="${GITHUB_WORKSPACE}/datasets"
            python tests/cache_test_assets.py
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *asset-paths
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

