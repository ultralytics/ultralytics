# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# P4 detection head is removed; p3p5-correct-topdown-sni neck (SNI-damped
# top-down: 768 P4 intermediate, 384 P3 head, 512 second P4 intermediate) on
# Fatih's encoder-experiments ultravit backbone (l-size design from the p4p5
# ultravit finals).
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

scales:
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [5.0625, True, 0.00001, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [7.40625, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3.203125, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 6.28125, True, 0.00001, False, 64]]

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # SNI damping
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [768, True]] # 12 widened intermediate P4/16 (top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # SNI damping
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [384, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat intermediate P4
  - [-1, 2, C3k2, [512, True]] # 19 intermediate P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 22], 1, Detect, [nc]] # Detect(P3, P5)
