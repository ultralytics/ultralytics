# Lane A detector for the DINO-P5 RoPE-Mixed backbone, depth-hybrid scaling. Rows 0-8 match
# yolo26-ultravit-repmixer-fastvitffn-dinop5-mixedrope-hybrid-s640-cls.yaml, its classifier twin.
# One P5 attention block at n and s where a single block is fastest, two at m and l and three at x. n and s match
# measured RoPE-Mixed trunks, m, l and x are new graphs and their latency is not yet measured. l keeps the wider
# P5 from the l640 retune, taken through max_channels rather than width, which would scale the neck and head too.
# n caps at 1024 so head_dim 64 divides its P5. The raw P5 arg is 1280 and every scale but s caps below it,
# so raising s to max_channels 1280 widens s P5 from 576 to 640 and leaves the other four scales untouched.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  # depth also sets the P5 attention block count via round(8 * depth): 1 at n and s, 2 at m and l, 3 at x.
  # n and s stay at 0.18 so they resolve to a single P5 block, the configuration that wins at those sizes.
  n: [0.18, 0.25, 1024]
  s: [0.18, 0.50, 1280]
  m: [0.25, 1.00, 512]
  l: [0.24, 1.00, 640]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1280, 3, 2]]
  - [-1, 8, MixedRoPE2D, [0, 4, True, 0.00001, False, 64, True, True, True, 4]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
