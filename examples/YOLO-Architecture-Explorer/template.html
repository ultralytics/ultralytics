                    } else if (i === 0 || (srcOf(l).includes(i - 1) && cur.includes(L[i - 1]))) {
                        cur.push(l);
                        if (s) maxS = Math.max(maxS, s);
                    } else links.push(l);
                }
                const main = chains.pop();
                const cols = [...chains, ...(links.length ? [links] : []), main];
                const headers = [
                    ...chains.map((_, k) => `Backbone · branch${chains.length > 1 ? " " + (k + 1) : ""}`),
                    ...(links.length ? [[...new Set(links.map((l) => l.type))].join(" / ") + " links"] : []),
                    chains.length ? "Backbone · main" : "Backbone",
                ];
                return { cols, headers };
            }
            // does this layer's internal wiring differ between the current mode and the other one?
            function phaseDelta(l) {
                const other = l.variants[otherPhase()] || [];
                return V(l).some(([k, sc]) => {
                    const t = other.find(([, s2]) => s2.some((x) => sc.includes(x)))?.[0];
                    return t && structDiff(k, t);
                });
            }
            // structural difference between two block graphs, recursively; BatchNorm folding alone does not count
            const DIFF_CACHE = new Map();
            function structDiff(a, b, depth = 0) {
                if (a === b) return false;
                const ck = a + "|" + b;
                if (DIFF_CACHE.has(ck)) return DIFF_CACHE.get(ck);
                const sig = (n) => (n.kind === "module" && n.type !== "BatchNorm2d" ? `${n.name}|${n.type}` : null);
                const A = DATA.blocks[a].nodes,
                    B = DATA.blocks[b].nodes;
                const sa = A.map(sig).filter(Boolean).sort(),
                    sb = B.map(sig).filter(Boolean).sort();
                let d = sa.join() !== sb.join();
                if (!d && depth < 8)
                    d = A.some((n) => {
                        if (!n.g) return false;
                        const m = B.find((x) => x.g && x.name === n.name && x.type === n.type);
                        return m && structDiff(n.g, m.g, depth + 1);
                    });
                DIFF_CACHE.set(ck, d);
                return d;
            }
            function splitNeck(cfg) {
                const L = cfg.layers,
                    nb = cfg.nb;
                const head = L.slice(nb, L.length - 1);
                let k = head.length,
                    prev = strideOf(L[nb - 1]);
                for (let t = 0; t < head.length; t++) {
                    const s = strideOf(head[t]);
                    if (s != null && prev != null && s > prev) {
                        k = t;
                        break;
                    }
                    if (s != null) prev = s;
                }
                return [head.slice(0, k), head.slice(k)];
            }

            /* ------------------------------------------------------------ overview strip (compact, like the reference header) */
            function drawOverview(cfg, g) {
                const L = cfg.layers,
                    nb = cfg.nb,
                    last = L[L.length - 1];
                const bstr = [...new Set(L.slice(0, nb).map(strideOf).filter((s) => s && s > 1))].sort((a, b) => a - b);
                const all = [...new Set([...bstr, ...L.slice(nb, -1).map(strideOf).filter(Boolean)])].sort((a, b) => b - a);
                const RH = 36,
                    top = 46,
                    CH = 22;
                const cy = (s) => top + all.indexOf(s) * RH + CH / 2;
                const nodes = [],
                    edges = [],
                    at = {};
                const maxW = 210,
                    PX = 10;
                bstr.forEach((s, k) => {
                    const w = maxW - (k * (maxW - 96)) / Math.max(1, bstr.length - 1);
                    let li = 0;
                    for (let i = 0; i < nb; i++) if (strideOf(L[i]) === s) li = i;
                    const id = `os${s}`;
                    nodes.push({ id, kind: "slab", x: PX + (maxW - w) / 2, y: cy(s) - CH / 2, w, h: CH, fam: "io", title: `${lvl(s)} · ${L[li].hw[0]}×${L[li].hw[1]}`, layer: li, act: layerAct(L[li], id), full: layerFull(L[li]) });
                    at[`s${s}`] = { x: PX + (maxW + w) / 2 + 12, y: cy(s) };
                });
                let x = PX + maxW + 70;
                const neckX = x;
                const chipFor = (l) =>
                    ({ Upsample: "U", Concat: "C", ConvTranspose2d: "UT" })[l.type] || (l.cls === "Sequential" ? `${l.type}×n` : l.type);
                for (const l of L.slice(nb, -1)) {
                    const s = strideOf(l) ?? all[0];
                    const lab = chipFor(l);
                    const w = Math.max(26, tw(lab, 7) + 14);
                    const id = `oc${l.i}`;
                    nodes.push({ id, kind: "chip", x, y: cy(s) - CH / 2, w, h: CH, fam: fam(l.cls === "Sequential" ? l.type : l.cls), title: lab, layer: l.i, act: layerAct(l, id), full: layerFull(l) });
                    at[l.i] = { lx: x, rx: x + w, y: cy(s) };
                    x += w + 18;
                }
                const from = (src) => {
                    if (src < nb) {
                        const p = at[`s${strideOf(cfg.layers[src])}`];
                        return p ? [p.x, p.y, `os${strideOf(cfg.layers[src])}`] : null;
                    }
                    return at[src] ? [at[src].rx, at[src].y, `oc${src}`] : null;
                };
                for (const l of L.slice(nb, -1))
                    for (const src of srcOf(l)) {
                        const a = from(src);
                        if (a) edges.push({ s: a[2], t: `oc${l.i}`, d: hcurve(a[0], a[1], at[l.i].lx, at[l.i].y), cls: "ov" });
                    }
                // outputs: one level slab + head chip per input, then a predictions note
                const headX = x + 30;
                const ins = srcOf(last);
                const dlab = last.type;
                const dW = Math.max(60, tw(dlab, 7) + 16);
                const used = new Set();
                ins.forEach((src, j) => {
                    let s = strideOf(L[src]) ?? all[0];
                    let y = cy(s) - CH / 2;
                    while (used.has(y)) y += CH + 6;
                    used.add(y);
                    const sid = `oo${j}`,
                        did = `od${j}`;
                    nodes.push({ id: sid, kind: "slab", x: headX, y, w: 70, h: CH, fam: "io", title: lvl(s), layer: last.i, act: layerAct(last, sid), full: layerFull(last) });
                    nodes.push({ id: did, kind: "chip", x: headX + 104, y, w: dW, h: CH, fam: "head", title: dlab, layer: last.i, act: layerAct(last, did), full: layerFull(last) });
                    const a = from(src);
                    if (a) edges.push({ s: a[2], t: sid, d: hcurve(a[0], a[1], headX, y + CH / 2), cls: "ov" });
                    edges.push({ s: sid, t: did, d: `M${headX + 82},${y + CH / 2} L${headX + 104},${y + CH / 2}`, cls: "ov" });
                });
                const lines = last.args
                    .filter(([k, v]) => k !== "ch" && String(v).length <= 22)
                    .slice(0, 3)
                    .map(([k, v]) => `${k} = ${v}`);
                lines.push(S.phase === "train" ? "outputs → loss (training)" : "outputs → post-processing");
                const nx = headX + 104 + dW + 50,
                    nw = Math.max(...lines.map((s) => tw(s, 6.4))) + 26,
                    nh = 30 + lines.length * 15;
                const midY = top + ((all.length - 1) * RH) / 2 + CH / 2;
                nodes.push({ id: "onote", kind: "note", x: nx, y: midY - nh / 2, w: nw, h: nh, fam: "head", title: last.type, lines, layer: last.i, act: layerAct(last, "onote"), full: layerFull(last) });
                ins.forEach((_, j) => {
                    const d = nodes.find((n) => n.id === `od${j}`);
                    edges.push({ s: `od${j}`, t: "onote", d: hcurve(d.x + d.w, d.y + CH / 2, nx, midY), cls: "ov" });
                });
                for (const [x0, t] of [
                    [PX, "Backbone"],
                    [neckX, "Neck"],
                    [headX, "Head"],
                ])
                    el("text", { class: "colhdr", x: x0, y: 18 }, g).textContent = t;
                el("text", { class: "ovhint", x: PX, y: 34 }, g).textContent = "overview — click any piece to open it";
                paint(g, nodes, edges);
                return { w: nx + nw, h: top + all.length * RH };
            }

            /* ------------------------------------------------------------ main diagram, rows grouped by resolution */
            const W = 240,
                H = 58,
                GX = 176,
                ROW = 82,
                BGAP = 26;
            function drawMain(cfg, g) {
                const L = cfg.layers,
                    nb = cfg.nb,
                    last = L[L.length - 1];
                const [fpn, pan] = splitNeck(cfg);
                const bb = splitBackbone(cfg);
                const cols = [...bb.cols, fpn];
                if (pan.length) cols.push(pan);
                const ncol = cols.length,
                    fpnCol = bb.cols.length;
                // every column is split into stride bands; a band is as tall as its busiest column, so a neck node
                // sits level with the backbone stage of the same resolution and skip connections run horizontally
                const colBands = cols.map((list) => {
                    const m = new Map();
                    let prev = 1;
                    for (const it of list) {
                        // layers without a feature-map output (e.g. CBLinear) sit on the band of their source
                        const s = it === "in" ? 1 : (strideOf(it) ?? strideOf(L[srcOf(it)[0]]) ?? prev);
                        prev = s;
                        if (!m.has(s)) m.set(s, []);
                        m.get(s).push(it);
                    }
                    return m;
                });
                const strides = [...new Set(colBands.flatMap((m) => [...m.keys()]))].sort((a, b) => a - b);
                const band = {};
                let y = 0;
                for (const s of strides) {
                    const rows = Math.max(...colBands.map((m) => m.get(s)?.length || 0));
                    band[s] = { top: y, h: rows * ROW };
                    y += rows * ROW + BGAP;
                }
                const TH = y - BGAP;
                const pos = {};
                colBands.forEach((m, c) => {
                    for (const [s, list] of m) {
                        const b = band[s],
                            step = b.h / list.length;
                        list.forEach((it, i) => {
                            const t = c === fpnCol ? list.length - 1 - i : i; // the top-down neck flows upward
                            pos[it === "in" ? "in" : it.i] = { x: c * (W + GX), y: b.top + (t + 0.5) * step - H / 2, c, k: cols[c].indexOf(it) };
                        });
                    }
                });
                const bg = el("g", {}, g);
                const fullW = (ncol + 1) * (W + GX) - GX;
                strides.forEach((s, i) => {
                    const b = band[s];
                    el("rect", { class: "band", x: -70, y: b.top - BGAP / 2, width: fullW + 100, height: b.h + BGAP, opacity: i % 2 ? 0 : 1 }, bg);
                    const t = el("text", { class: "bandlbl", x: -44, y: b.top + b.h / 2 + 4, "text-anchor": "middle" }, bg);
                    t.textContent = s === 1 ? "input" : lvl(s);
                    if (s > 1) el("text", { class: "bandsub", x: -44, y: b.top + b.h / 2 + 18, "text-anchor": "middle" }, bg).textContent = `/${s}`;
                });
                const hdr = [...bb.headers, pan.length ? "Neck · top-down ↑" : "Head ↑", "Neck · bottom-up ↓"];
                for (let c = 0; c <= ncol; c++) {
                    if (c < ncol) el("rect", { class: "colbg", x: c * (W + GX) - 16, y: -44, width: W + 32, height: TH + 58, rx: 12 }, bg);
                    el("text", { class: "colhdr", x: c * (W + GX) + W / 2, y: -22, "text-anchor": "middle" }, bg).textContent = c === ncol ? "Output" : hdr[c];
                }
                const nodes = [],
                    edges = [],
                    by = {};
                const mk = (id, l, p, extra = {}) => {
                    const n = {
                        id,
                        kind: "module",
                        layer: l.i,
                        x: p.x,
                        y: p.y,
                        w: W,
                        h: H,
                        fam: fam(l.cls === "Sequential" ? l.type : l.cls),
                        title: l.cls === "Sequential" ? `${l.type} ×n` : l.type,
                        sub: subtitle(cfg, l),
                        idx: l.i,
                        act: layerAct(l, id),
                        full: layerFull(l),
                        isOpen: S.cards[0]?.from === id,
                        delta: phaseDelta(l),
                        symSub: S.mode === "sym",
                        ...extra,
                    };
                    nodes.push(n);
                    by[id] = n;
                    return n;
                };
                by.in = { id: "in", kind: "input", ...pos.in, w: W, h: H, fam: "io", title: "Input image", sub: `${DATA.imgsz}×${DATA.imgsz}×3` };
                nodes.push(by.in);
                for (const l of L.slice(0, -1)) mk(l.i, l, pos[l.i]);
                for (const list of bb.cols) {
                    let maxS = 1; // P-level tag where a backbone column reaches a new stride
                    for (const it of list) {
                        const s = it === "in" ? 1 : strideOf(it);
                        if (it !== "in" && s && s > maxS) by[it.i].pl = lvl(s);
                        if (s) maxS = Math.max(maxS, s);
                    }
                }
                const ins = srcOf(last);
                const dx = ncol * (W + GX);
                const dets = ins.map((src, j) =>
                    mk(`det${j}`, last, { x: dx, y: pos[src] ? pos[src].y : (j + 0.5) * (TH / ins.length) - H / 2 }, { pl: lvl(strideOf(L[src])) }),
                );
                dets.sort((a, b) => a.y - b.y);
                for (let i = 1; i < dets.length; i++) if (dets[i].y < dets[i - 1].y + H + 14) dets[i].y = dets[i - 1].y + H + 14;
                const addEdge = (s, t, label) => {
                    const a = by[s],
                        b = by[t];
                    let d, lx, ly;
                    const pa = pos[s === "in" ? "in" : s],
                        pb = pos[t];
                    if (Math.abs(a.x - b.x) < 1) {
                        const down = b.y > a.y;
                        const x = a.x + W / 2,
                            y1 = down ? a.y + H : a.y,
                            y2 = down ? b.y : b.y + H;
                        if (pa && pb && Math.abs(pa.k - pb.k) === 1) {
                            d = `M${x},${y1} L${x},${y2}`;
                            lx = x;
                            ly = (y1 + y2) / 2;
                        } else {
                            const sx = a.x + W,
                                sy = a.y + H / 2,
                                ty = b.y + H / 2;
                            d = `M${sx},${sy} C${sx + 80},${sy} ${sx + 80},${ty} ${sx},${ty}`;
                            lx = sx + 60;
                            ly = (sy + ty) / 2;
                        }
                    } else {
                        const right = b.x > a.x;
                        const sx = right ? a.x + W : a.x,
                            sy = a.y + H / 2,
                            tx = right ? b.x : b.x + W,
                            ty = b.y + H / 2;
                        d = hcurve(sx, sy, tx, ty);
                        const near = Math.abs(tx - sx) <= GX * 1.2;
                        lx = near ? (sx + tx) / 2 : sx + (right ? 1 : -1) * (GX / 2);
                        ly = near ? (sy + ty) / 2 : sy;
                    }
                    edges.push({ s, t, d, label, lx, ly, sym: S.mode === "sym" });
                };
                for (const l of L.slice(0, -1)) {
                    if (l.i === 0) addEdge("in", 0, shapeLabel(cfg, null));
                    else for (const s of srcOf(l)) addEdge(s, l.i, shapeLabel(cfg, L[s]));
                }
                ins.forEach((s, j) => addEdge(s, `det${j}`, shapeLabel(cfg, L[s])));
                paint(g, nodes, edges);
                return { w: fullW, h: Math.max(TH, ...dets.map((d) => d.y + H)) };
            }

            /* ------------------------------------------------------------ block internals (dagre) */
            function curve(pts) {
                let d = `M${pts[0].x},${pts[0].y}`;
                if (pts.length < 3) return d + ` L${pts[pts.length - 1].x},${pts[pts.length - 1].y}`;
                for (let i = 1; i < pts.length - 1; i++) {
                    const p = pts[i],
                        q = pts[i + 1];
                    const end = i === pts.length - 2;
                    d += ` Q${p.x},${p.y} ${end ? q.x : (p.x + q.x) / 2},${end ? q.y : (p.y + q.y) / 2}`;
                }
                return d;
            }
            const LAYOUTS = new Map();
            // the same block in the other mode, level by level (null where it does not exist there)
            function twinChain(chain) {
                const cfg = cfgById[S.cfg],
                    other = otherPhase(),
                    out = [];
                for (const [i, c] of chain.entries()) {
                    if (i === 0) {
                        const l = c.layer != null ? cfg.layers[c.layer] : null;
                        const scales = l ? V(l)[c.vi]?.[1] || [] : [];
                        out.push(l ? (l.variants[other] || []).find(([, sc]) => sc.some((x) => scales.includes(x)))?.[0] || null : null);
                    } else {
                        const t = out[i - 1],
                            n = DATA.blocks[chain[i - 1].key].nodes[c.from ?? c.j];
                        out.push(t ? DATA.blocks[t].nodes.find((m) => m.g && m.name === n?.name && m.type === n?.type)?.g || null : null);
                    }
                }
                return out;
            }
            // mark blocks / ops that the other mode does not have (e.g. BatchNorm2d, the one-to-one head)
            function markOnly(nodes, key, twin) {
                if (!twin || twin === key) return 0;
                const sig = (n) => (n.kind === "module" ? `m:${n.name}|${n.type}` : n.kind === "op" ? `o:${n.type}` : null);
                const pool = new Map();
                for (const n of DATA.blocks[twin].nodes) {
                    const k = sig(n);
                    if (k) pool.set(k, (pool.get(k) || 0) + 1);
                }
                let c = 0;
                for (const n of nodes) {
                    const k = sig(n);
                    if (!k) continue;
                    if (pool.get(k)) pool.set(k, pool.get(k) - 1);
                    else if (n.kind === "module" || n.type !== "slice") n.only = ++c;
                }
                return c;
            }
            function layoutBlock(key, cid, prefix, ctx) {
                const b = DATA.blocks[key];
                const sym = b.syms[b.sym[cid] ?? 0];
                const nodes = b.nodes.map((n, j) => {
                    const hp = { ...(n.hp || {}), ...(sym.hp[j] || {}) };
                    const shape = (sym.out[j] || []).join("  |  ");
                    let title, sub, f;
                    if (n.kind === "input" || n.kind === "output") {
                        title = n.kind === "input" ? `input ${n.type.slice(2)}` : `output ${n.type.slice(3)}`;
                        sub = shape;
                        f = "io";
                    } else if (n.kind === "const") {
                        title = `const · ${n.type}`;
                        sub = shape;
                        f = "io";
                    } else if (n.kind === "op") {
                        title = sym.arg[j] ? `${n.type}(${sym.arg[j]})` : n.type;
                        f = OP_FAM[n.type] || "op";
                    } else if (n.type === "Sequential" && n.hp?.layers) {
                        title = n.name;
                        sub = n.hp.layers;
                        f = "seq";
                    } else if (n.type.endsWith("()")) {
                        title = n.type;
                        sub = n.name;
                        f = "fn";
                    } else {
                        title = n.type;
                        const ks = "k" in hp ? `k=${hp.k}, s=${hp.s}${hp.p != null ? ", p=" + hp.p : ""}` : "";
                        const flags = Object.entries(n.hp || {})
                            .filter(([k]) => !["k", "s", "p", "d", "act", "fn", "layers"].includes(k))
                            .map(([k, v]) => `${k}=${fv(v)}`)
                            .slice(0, 2);
                        sub = [n.name, ks, ...flags].filter(Boolean).join(" · ");
                        f = fam(n.type);
                    }
                    const w = Math.max(tw(title, 8.4) + 34, tw(sub || "", 6.9) + 26, n.kind === "op" ? 70 : 128);
                    const h = n.kind === "op" ? 32 : sub ? 50 : 36;
                    return { id: prefix + j, j, kind: n.kind, type: n.type, name: n.name, g: n.g, title, sub, fam: f, w, h, stack: n.group, badge: n.group ? "×n" : null, hp, shape, ctx: { ...ctx, key } };
                });
                // simple mode: drop reshape-only ops and constants, wiring each consumer to the real producer
                const hidden = new Set();
                if (S.simple) b.nodes.forEach((n, j) => (n.kind === "const" || (n.kind === "op" && PLUMB.has(n.type))) && hidden.add(j));
                const firstIn = {};
                for (const [s, si, d, di] of b.edges) if (!(d in firstIn) || di < firstIn[d][2]) firstIn[d] = [s, si, di];
                const raw = [];
                const seenE = new Set();
                for (const [s0, si0, d, di, each] of b.edges) {
                    if (hidden.has(d)) continue;
                    let s = s0,
                        si = si0,
                        guard = 0;
                    while (hidden.has(s) && firstIn[s] && guard++ < 50) [s, si] = firstIn[s];
                    if (hidden.has(s)) continue;
                    const k = `${s}|${si}|${d}|${di}`;
                    if (seenE.has(k)) continue;
                    seenE.add(k);
                    const src = sym.out[s0] || [];
                    let label = src[si0] || "";
                    if (src.length > 1 && s0 === s) label = `[${si0}] ${label}`;
                    if (each) label += " ×n";
                    raw.push({ s, d, label });
                }
                const keep = b.nodes.map((_, j) => !hidden.has(j));
                const vis = nodes.filter((_, j) => keep[j]);
                const edges = raw.map((e) => ({ s: prefix + e.s, t: prefix + e.d, label: e.label, sd: [e.s, e.d] }));
                const ck = `${key}|${cid}|${S.labels}|${S.simple}`;
                let L = LAYOUTS.get(ck);
                if (!L && typeof dagre !== "undefined") {
                    const G = new dagre.graphlib.Graph({ multigraph: true });
                    G.setGraph({ rankdir: "TB", nodesep: 24, ranksep: 34, edgesep: 14, marginx: 0, marginy: 0 });
                    vis.forEach((n) => G.setNode(String(n.j), { width: n.w, height: n.h }));
                    edges.forEach((e, k) => {
                        const lw = S.labels && e.label ? tw(e.label, 7.1) + 10 : 0;
                        G.setEdge(String(e.sd[0]), String(e.sd[1]), { width: lw, height: lw ? 18 : 0, labelpos: "c" }, "e" + k);
                    });
                    dagre.layout(G);
                    L = {
                        pos: Object.fromEntries(vis.map((n) => [n.j, G.node(String(n.j))])),
                        edges: edges.map((e, k) => G.edge({ v: String(e.sd[0]), w: String(e.sd[1]), name: "e" + k })),
                        w: G.graph().width,
                        h: G.graph().height,
                    };
                    LAYOUTS.set(ck, L);
                }
                if (!L) return { nodes: [], edges: [], w: 420, h: 40, missing: true };
                vis.forEach((n) => {
                    n.x = L.pos[n.j].x - n.w / 2;
                    n.y = L.pos[n.j].y - n.h / 2;
                });
                edges.forEach((e, k) => Object.assign(e, { d: curve(L.edges[k].points), lx: L.edges[k].x, ly: L.edges[k].y }));
                return { nodes: vis, edges, w: L.w, h: L.h };
            }

            /* ------------------------------------------------------------ detail cards beside the diagram */
            const CARD_GAP = 56,
                HDR = 46,
                PAD = 18;
            function drawCards(g, x0, y0) {
                const cfg = cfgById[S.cfg];
                let x = x0;
                const rects = [];
                const twins = twinChain(S.cards);
                S.cards.forEach((c, ci) => {
                    const lay = layoutBlock(c.key, S.cfg, `c${ci}_`, { card: ci, layer: c.layer });
                    const nOnly = markOnly(lay.nodes, c.key, twins[ci]);
                    for (const n of lay.nodes) {
                        n.isOpen = S.cards[ci + 1]?.from === n.j;
                        if (n.g) {
                            n.act = () => openChildCard(ci, n);
                            n.full = () => openFullFromCards(ci, n);
                        }
                    }
                    const b = DATA.blocks[c.key];
                    const layer = c.layer != null ? cfg.layers[c.layer] : null;
                    const variants = layer && V(layer).length > 1 ? V(layer) : [];
                    const subT =
                        (ci === 0 ? `${b.owner} internals · ${S.cfg}` : `inside ${DATA.blocks[S.cards[ci - 1].key].owner} · level ${ci + 1}`) +
                        ` · ${PHASE_LABEL[S.phase]}` +
                        (nOnly ? ` · ${nOnly} only in this mode` : twins[ci] === c.key ? " · same as " + PHASE_LABEL[otherPhase()].toLowerCase() : "");
                    const hdrW = Math.max(tw(c.label, 8.4), tw(subT, 6.4)) + 110 + variants.reduce((a, [, s]) => a + tw(s.join(","), 6.8) + 22, 0);
                    const cw = Math.max(lay.w + 2 * PAD, hdrW, 280),
                        ch = lay.h + HDR + PAD + 6;
                    const cg = el("g", { transform: `translate(${x},${y0})` }, g);
                    el("rect", { class: "card", width: cw, height: ch, rx: 12 }, cg);
                    el("rect", { class: "cardhdr", width: cw, height: HDR - 8, rx: 12 }, cg);
                    el("rect", { class: "cardhdr", y: HDR - 20, width: cw, height: 12 }, cg);
                    el("text", { class: "cardt", x: 14, y: 17 }, cg).textContent = c.label;
                    el("text", { class: "cards", x: 14, y: 31 }, cg).textContent = subT;
                    let bx = cw - 10 - (tw("×", 6.8) + 16);
                    svgButton(cg, bx, 8, "×", () => closeCards(ci), false, "Close this level and deeper");
                    bx -= tw("⤢", 6.8) + 16 + 4;
                    svgButton(cg, bx, 8, "⤢", () => openFullFromCards(ci), false, "Open full view");
                    bx -= 10;
                    for (let i = variants.length - 1; i >= 0; i--) {
                        const lab = variants[i][1].join(",");
                        const w = tw(lab, 6.8) + 16;
                        bx -= w + 4;
                        svgButton(cg, bx, 8, lab, () => openLayerCard(layer, i, c.from), c.vi === i, "Structure used at these scales");
                    }
                    const inner = el("g", { transform: `translate(${(cw - lay.w) / 2},${HDR})` }, cg);
                    if (lay.missing)
                        el("text", { x: 0, y: 20, style: "fill:var(--new)" }, inner).textContent = "dagre did not load — internals need cdnjs.cloudflare.com";
                    paint(inner, lay.nodes, lay.edges);
                    rects.push({ x, y: y0, w: cw, h: ch, ox: x + (cw - lay.w) / 2, oy: y0 + HDR, lay });
                    x += cw + CARD_GAP;
                });
                // dashed connectors: from the opened block inside one card to the next card
                rects.forEach((r, ci) => {
                    if (!ci) return;
                    const p = rects[ci - 1],
                        n = p.lay.nodes.find((m) => m.j === S.cards[ci].from);
                    if (!n) return;
                    const sx = p.ox + n.x + n.w,
                        sy = p.oy + n.y + n.h / 2;
                    const path = el("path", { class: "conn", d: hcurve(sx, sy, r.x, r.y + 20) }, g);
                    g.insertBefore(path, g.firstChild);
                });
                S.cards.forEach((c, i) => (c.rect = rects[i]));
                return x - x0;
            }

            /* ------------------------------------------------------------ views */
            let lastMain = null;
            function renderArch(cfg) {
                clear();
                const root = el("g", {}, vp);
                const ov = drawOverview(cfg, el("g", {}, root));
                const oy = ov.h + 90;
                const mg = el("g", { transform: `translate(0,${oy})` }, root);
                const m = drawMain(cfg, mg);
                const cx0 = Math.max(m.w, ov.w) + 120;
                drawCards(mg, cx0, -44);
                for (const c of S.cards) if (c.rect) c.abs = { x: c.rect.x, y: c.rect.y + oy, w: c.rect.w, h: c.rect.h };
                bbox = { x: -80, y: -10, w: Math.max(m.w, ov.w) + 120, h: oy + m.h + 30 };
                lastMain = bbox;
            }
            function renderFocus() {
                clear();
                const p = S.path[S.path.length - 1];
                const lay = layoutBlock(p.key, S.cfg, "b", { focus: true, layer: S.path[0].layer, depth: S.path.length - 1 });
                markOnly(lay.nodes, p.key, twinChain(S.path)[S.path.length - 1]);
                for (const n of lay.nodes) if (n.g) n.act = () => drill(n.g, `${n.name} · ${n.type}`, n.j);
                if (lay.missing) el("text", { x: 0, y: 20, style: "fill:var(--new)" }, vp).textContent = "dagre did not load — internals need cdnjs.cloudflare.com";
                paint(el("g", {}, vp), lay.nodes, lay.edges);
                bbox = { x: -20, y: -20, w: lay.w + 50, h: lay.h + 40 };
            }

            /* ------------------------------------------------------------ navigation */
            function openLayerCard(l, vi, from) {
                S.cards = [{ key: V(l)[vi][0], label: `${l.i} · ${l.type}`, layer: l.i, vi, from }];
                S.sel = from;
                S.focus = 0;
                render(true);
            }
            function openChildCard(ci, n) {
                S.cards = [...S.cards.slice(0, ci + 1), { key: n.g, label: `${n.name ? n.name + " · " : ""}${n.type}`, from: n.j }];
                S.sel = n.id;
                S.focus = ci + 1;
                render(true);
            }
            function closeCards(ci) {
                S.cards = S.cards.slice(0, ci);
                S.sel = null;
                S.focus = ci ? ci - 1 : "main";
                render(true);
            }
            function openFull(l, vi) {
                S.path = [{ key: V(l)[vi][0], label: `${l.i} · ${l.type}`, layer: l.i, vi }];
                S.sel = null;
                render();
            }
            function openFullFromCards(ci, n) {
                const chain = S.cards.slice(0, ci + 1).map((c, i) =>
                    i === 0 && c.layer != null ? { key: c.key, label: c.label, layer: c.layer, vi: c.vi } : { key: c.key, label: c.label, j: c.from },
                );
                if (n) chain.push({ key: n.g, label: `${n.name} · ${n.type}`, j: n.j });
                S.path = chain;
                S.sel = null;
                render();
            }
            function drill(key, label, j) {
                S.path.push({ key, label, j });
                S.sel = null;
                render();
            }
            function up(level) {
                S.path = S.path.slice(0, level);
                S.sel = null;
                render();
            }
            function go(cid) {
                S.view = "arch";
                S.cfg = cid;
                S.path = [];
                S.cards = [];
                S.sel = null;
                if (S.mode !== "sym" && !scaleKeys(cfgById[cid]).includes(S.mode)) S.mode = "sym";
                render();
            }
            document.addEventListener("keydown", (e) => {
                if (["INPUT", "SELECT"].includes(e.target.tagName) || S.view !== "arch") return;
                if (e.key === "Escape") {
                    if (S.path.length) up(S.path.length - 1);
                    else if (S.cards.length) closeCards(S.cards.length - 1);
                }
                if (e.key === "f") animateTo(viewFor(bbox, 1.3));
            });

            /* ------------------------------------------------------------ chrome */
            function renderHeader() {
                $("#meta").textContent = `· ultralytics ${DATA.ultralytics} · traced at ${DATA.imgsz}×${DATA.imgsz}`;
                const cur = cfgById[S.cfg];
                $("#vtabs").innerHTML = DATA.versions
                    .filter((v) => v.configs.length)
                    .map((v) => `<button class="tab ${S.view === "arch" && cur.version === v.name ? "on" : ""}" data-v="${esc(v.name)}">${esc(v.name)}</button>`)
                    .join("");
                $("#vtabs")
                    .querySelectorAll(".tab")
                    .forEach((b) => (b.onclick = () => go(DATA.versions.find((x) => x.name === b.dataset.v).configs[0])));
                $("#viewseg")
                    .querySelectorAll("button")
                    .forEach((b) => b.classList.toggle("on", b.dataset.v === S.view));
            }
            function renderSubbar() {
                const bar = $("#subbar");
                if (S.view === "evo") {
                    bar.innerHTML = `<span class="muted">Every module class the detection configs instantiate, per version — <span class="dot first"></span> first used · <span class="dot"></span> used</span>`;
                    return;
                }
                const cur = cfgById[S.cfg];
                const ver = DATA.versions.find((v) => v.name === cur.version);
                let h = "";
                if (ver.configs.length > 1)
                    h += `<select id="cfgsel" title="Config file">${ver.configs.map((c) => `<option ${c === S.cfg ? "selected" : ""} value="${c}">${c}.yaml</option>`).join("")}</select>`;
                const trail = S.path.length ? S.path : S.cards;
                h += `<div class="seg phase" id="phaseseg">${cur.phase_list
                    .map((ph) => `<button data-p="${ph}" class="${S.phase === ph ? "on" : ""}" title="${esc(PHASE_TIP[ph])}">${PHASE_LABEL[ph]}</button>`)
                    .join("")}</div>`;
                h += `<div class="crumbs">${trail.length ? `<a data-l="0">${esc(cur.id)}</a>` : `<b>${esc(cur.id)}</b>`}`;
                trail.forEach((p, i) => {
                    h += `<span class="sep">›</span>${i === trail.length - 1 ? `<b>${esc(p.label)}</b>` : `<a data-l="${i + 1}">${esc(p.label)}</a>`}`;
                });
                h += `</div>`;
                if (S.path.length) h += `<button class="btn" id="backcards">↩ back to diagram</button>`;
                h += `<div class="spacer"></div>`;
                const scales = scaleKeys(cur).filter(Boolean);
                if (!S.path.length && scales.length > 1)
                    h += `<span class="muted">shapes</span><div class="seg" id="modeseg">${["sym", ...scales]
                        .map((m) => `<button data-m="${m}" class="${S.mode === m ? "on" : ""}">${m === "sym" ? "symbolic" : m}</button>`)
                        .join("")}</div>`;
                if (S.path.length === 1 && S.path[0].layer != null) {
                    const l = cur.layers[S.path[0].layer];
                    if (V(l).length > 1)
                        h += `<span class="muted">structure for scale</span><div class="seg" id="varseg">${V(l)
                            .map(([, sc], i) => `<button data-i="${i}" class="${S.path[0].vi === i ? "on" : ""}">${sc.join(", ")}</button>`)
                            .join("")}</div>`;
                }
                h += `<label class="muted" title="Hide reshape-only ops (view, permute, …) and constants inside blocks"><input type="checkbox" id="simple" ${S.simple ? "checked" : ""}/> simple</label>`;
                h += `<label class="muted"><input type="checkbox" id="lbls" ${S.labels ? "checked" : ""}/> shape labels</label>`;
                bar.innerHTML = h;
                bar.querySelectorAll(".crumbs a").forEach(
                    (a) =>
                        (a.onclick = () => {
                            if (S.path.length) up(+a.dataset.l);
                            else closeCards(+a.dataset.l);
                        }),
                );
                if ($("#backcards"))
                    $("#backcards").onclick = () => {
                        S.path = [];
                        render();
                    };
                if ($("#cfgsel")) $("#cfgsel").onchange = (e) => go(e.target.value);
                bar.querySelectorAll("#phaseseg button").forEach((b) => (b.onclick = () => setPhase(b.dataset.p)));
                bar.querySelectorAll("#modeseg button").forEach(
                    (b) =>
                        (b.onclick = () => {
                            S.mode = b.dataset.m;
                            render(true);
                        }),
                );
                bar.querySelectorAll("#varseg button").forEach((b) => (b.onclick = () => openFull(cur.layers[S.path[0].layer], +b.dataset.i)));
                $("#simple").onchange = (e) => {
                    S.simple = e.target.checked;
                    render(true);
                };
                $("#lbls").onchange = (e) => {
                    S.labels = e.target.checked;
                    render(true);
                };
            }

            /* ------------------------------------------------------------ side panel */
            function scaleTable(cfg) {
                const sc = Object.entries(cfg.scales);
                const multi = sc.length > 1;
                const base = multi ? Math.min(...sc.map(([, v]) => v.max)) : null;
                let h = `<table><tr><th>scale</th>${multi ? '<th class="num">d</th><th class="num">w</th><th class="num">max_ch</th><th class="num">r</th>' : ""}<th class="num">params</th><th class="num">GFLOPs</th></tr>`;
                for (const [s, v] of sc)
                    h += `<tr><td>${s || "–"}</td>${multi ? `<td class="num">${v.d}</td><td class="num">${v.w}</td><td class="num">${v.max}</td><td class="num">${+v.r.toFixed(3)}</td>` : ""}<td class="num">${fmtN(v[S.phase].params)}</td><td class="num">${v[S.phase].gflops}</td></tr>`;
                h += "</table>";
                h += multi
                    ? `<p class="muted" style="font-size:12px">Each layer's channels = min(c, max_ch)·w and repeats n = round(n·d). With r = max_ch / ${base}, a YAML channel above ${base} reads as <span class="mono">${base}×w×r</span>, as in the reference diagram. GFLOPs count conv + linear layers at ${DATA.imgsz}×${DATA.imgsz}.</p>`
                    : `<p class="muted" style="font-size:12px">This file defines one model size, so shapes are literal. GFLOPs count conv + linear layers at ${DATA.imgsz}×${DATA.imgsz}.</p>`;
                return h;
            }
            // training vs deployment: interpretation plus the differences the build found in module paths and traces
            function phaseHTML(cfg) {
                const ph = S.phase === "train" ? "deploy" : S.phase;
                const d = cfg.phase_diff?.[ph];
                let h = `<h3>Training vs ${PHASE_LABEL[ph].toLowerCase()}</h3><ul class="notes">${cfg.phases.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`;
                if (!d) return h;
                const rows = (list, sign) =>
                    list
                        .map(
                            ([pat, type, roots, size]) =>
                                `<tr><td class="${sign === "−" ? "minus" : "plus"}">${sign}</td><td class="mono">${esc(pat)}</td><td>${esc(type)}${roots > 1 ? ` ×${roots}` : ""}${size > roots ? ` <span class="muted">(${size} modules)</span>` : ""}</td></tr>`,
                        )
                        .join("");
                const lead = d.removed.slice(0, 6).concat(d.added.slice(0, 4));
                h += `<p class="muted" style="font-size:12px">Found automatically by comparing every module path of the training model with the ${PHASE_LABEL[ph].toLowerCase()} model (indices generalised to <span class="mono">*</span>):</p>`;
                h += `<table class="diff">${rows(d.removed.slice(0, 6), "−")}${rows(d.added.slice(0, 4), "+")}</table>`;
                const more = d.removed.length + d.added.length - lead.length;
                if (more > 0) h += `<details><summary>${more} more path patterns</summary><table class="diff">${rows(d.removed.slice(6), "−")}${rows(d.added.slice(4), "+")}</table></details>`;
                const calls = Object.entries(d.calls).filter(([, v]) => v.length);
                if (calls.length) h += `<p style="font-size:12px">${calls.map(([k, v]) => `Only in ${PHASE_LABEL[k].toLowerCase()}: ${v.map((x) => `<span class="mono">${esc(x)}()</span>`).join(", ")}`).join("<br>")}</p>`;
                if (d.ops.length)
                    h += `<details><summary>Tensor ops that change (${d.ops.length})</summary><table class="diff"><tr><th>op</th><th class="num">training</th><th class="num">${PHASE_LABEL[ph].toLowerCase()}</th></tr>${d.ops
                        .map(([o, a, b]) => `<tr><td class="mono">${esc(o)}</td><td class="num">${a}</td><td class="num">${b}</td></tr>`)
                        .join("")}</table></details>`;
                return h + `<p class="muted" style="font-size:12px">In the diagram, <span class="deltanote">Δ</span> marks layers whose wiring changes beyond BatchNorm folding; inside cards, outlined blocks exist only in the current mode.</p>`;
            }
            function layerPanel(cfg, l) {
                const sc = scaleKeys(cfg);
                const cls = l.cls === "Sequential" ? l.type : l.cls;
                let h = `<h2>${l.i} · ${esc(l.type)}${l.cls === "Sequential" ? " ×n" : ""}</h2><p class="muted">${l.section} · from ${esc(JSON.stringify(l.f))}${l.n_sym ? ` · n = ${esc(l.n_sym)}` : ""}</p>`;
                h += `<p class="mono">${esc(l.yaml)}</p>`;
                if (V(l).length > 1) h += `<p class="muted">The internal structure differs between scales — switch variants in the detail card header.</p>`;
                h += `<h3>Resolved arguments</h3><table>${l.args.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join("")}</table>`;
                if (l.c_sym) h += `<h3>Output</h3><p class="mono">${l.hw[0]}×${l.hw[1]}×${esc(l.c_sym)} · stride ${strideOf(l)}</p>`;
                h += `<table><tr><th>scale</th>${l.n_sym ? '<th class="num">n</th>' : ""}<th>output h×w×c</th><th class="num">params</th></tr>`;
                sc.forEach((s, i) => {
                    const o = l.out[i];
                    h += `<tr><td>${s || "–"}</td>${l.n_sym ? `<td class="num">${l.n[i]}</td>` : ""}<td class="mono">${o ? o.join("×") : ""}</td><td class="num">${fmtN(l.params[S.phase][i])}</td></tr>`;
                });
                h += `</table><h3>About ${esc(cls)}</h3>` + blockInfoHTML(cls);
                return h;
            }
            function nodePanel(cfg, n) {
                let h = `<h2>${esc(n.type)} ${n.name ? `<span class="muted mono" style="font-weight:400">${esc(n.name)}</span>` : ""}</h2>`;
                h += `<p>${famDot(n.fam)}${FAM_LABEL[n.fam] || ""}${n.stack ? ` · repeated n = ${esc(n.hp.n || "")} times (chained)` : ""}</p>`;
                if (n.g) h += `<p class="muted">Click the block again to open it ${n.ctx.focus ? "" : "as the next card"}; double-click for the full view.</p>`;
                if (n.shape) h += `<h3>Output</h3><p class="mono">${esc(n.shape)}</p>`;
                const hp = Object.entries(n.hp || {}).filter(([k]) => k !== "n");
                if (hp.length) h += `<h3>Hyper-parameters</h3><table>${hp.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(fv(v))}</td></tr>`).join("")}</table>`;
                if (n.kind === "op") h += `<h3>Op</h3><p>${esc(OP_DOC[n.type] || "PyTorch tensor operation recorded from forward().")}</p>`;
                const top = n.ctx.focus ? n.ctx.depth === 0 : n.ctx.card === 0;
                if (n.kind === "input" && top && n.ctx.layer != null) {
                    const l = cfg.layers[n.ctx.layer];
                    const s = srcOf(l)[+n.type.slice(2)];
                    if (s != null && cfg.layers[s])
                        h += `<h3>Comes from</h3><p>layer ${s} · ${esc(cfg.layers[s].type)} <span class="mono">(${esc(shapeLabel(cfg, cfg.layers[s]))})</span></p>`;
                }
                if (n.kind === "module") h += `<h3>About</h3>` + (blockInfoHTML(n.type) || (n.type === "Sequential" ? "<p>An nn.Sequential branch folded into one node; open it to see its layers.</p>" : ""));
                return h;
            }
            function blockSummary(cfg, b) {
                return `<h2>${esc(b.owner)} <span class="muted" style="font-weight:400">internals</span></h2>
                    <p class="muted">Shapes are relative to this block: <span class="mono">h×w</span> is its input size, <span class="mono">c_in</span> / <span class="mono">c_out</span> its input / output channels and <span class="mono">n</span> its repeat count; other names (e.g. <span class="mono">c</span>) are the block's own attributes such as <span class="mono">self.c</span>, its hidden width. Fitted over every instance in ${esc(cfg.id)} at every scale; a value that does not reduce to one expression lists its distinct values.</p>
                    ${blockInfoHTML(b.owner, { open: true })}
                    <h3>This structure appears in</h3><p>${b.used.map((c) => `<button class="chip" data-cfg="${c}">${c}</button>`).join(" ")}</p>`;
            }
            function renderPanel() {
                const P = $("#panel");
                if (S.view === "evo") P.innerHTML = evoPanel();
                else {
                    const cfg = cfgById[S.cfg];
                    const n = S.sel != null ? NODES[S.sel] : null;
                    if (n && n.ctx) P.innerHTML = nodePanel(cfg, n);
                    else if (n && n.layer != null) P.innerHTML = layerPanel(cfg, cfg.layers[n.layer]);
                    else if (S.path.length) P.innerHTML = blockSummary(cfg, DATA.blocks[S.path[S.path.length - 1].key]) + `<h3>Legend</h3>${legendHTML()}`;
                    else {
                        const ver = DATA.versions.find((v) => v.name === cfg.version);
                        const newBlocks = Object.entries(DATA.catalog)
                            .filter(([, c]) => c.first === cfg.version && c.configs.includes(cfg.id) && c.file && c.family !== "fn")
                            .map(([k]) => k);
                        P.innerHTML = `<h2>${esc(cfg.id)}.yaml</h2><p class="muted mono">${esc(cfg.file)}</p><p>${esc(ver.note)}</p>
                            <p class="muted">Click any block — in the overview or the diagram — to open its internals beside the diagram; click blocks inside a card to keep going deeper.</p>
                            ${newBlocks.length ? `<h3>Blocks new in ${esc(cfg.version)}</h3><p>${newBlocks.map((b) => `<button class="chip" data-blk="${b}">${b}</button>`).join(" ")}</p>` : ""}
                            ${phaseHTML(cfg)}
                            <h3>Scales · ${PHASE_LABEL[S.phase]}</h3>${scaleTable(cfg)}<h3>Legend</h3>${legendHTML()}
                            <details><summary>YAML config</summary><pre class="code">${hl(cfg.yaml)}</pre></details>`;
                    }
                }
                P.querySelectorAll("[data-blk]").forEach((b) => (b.onclick = () => showBlock(b.dataset.blk)));
                P.querySelectorAll("[data-cfg]").forEach((b) => (b.onclick = () => go(b.dataset.cfg)));
                P.querySelectorAll("[data-struct]").forEach(
                    (b) =>
                        (b.onclick = () => {
                            const [key, cid] = b.dataset.struct.split("|");
                            S.view = "arch";
                            S.cfg = cid;
                            S.cards = [];
                            S.path = [{ key, label: `${DATA.blocks[key].owner} (from catalog)`, layer: null, j: "k" + key }];
                            S.sel = null;
                            render();
                        }),
                );
            }

            /* ------------------------------------------------------------ blocks & evolution view */
            const FAM_ORDER = ["conv", "down", "csp", "pool", "attn", "up", "concat", "head", "norm"];
            const versNames = () => DATA.versions.filter((v) => v.configs.length).map((v) => v.name);
            function renderEvo() {
                const vers = DATA.versions.filter((v) => v.configs.length);
                let h = `<div class="vcards">`;
                for (const v of vers) {
                    const nb = Object.entries(DATA.catalog).filter(([, c]) => c.first === v.name && c.file && c.family !== "fn");
                    h += `<div class="vcard"><h4>${esc(v.name)}</h4><p>${esc(v.note)}</p>
                        <div>${nb.map(([k]) => `<button class="chip" data-blk="${k}" title="new in ${esc(v.name)}">${famDot(DATA.catalog[k].family)}${k}</button>`).join("")}</div>
                        <div class="cfgs">${v.configs.map((c) => `<button class="chip" data-cfg="${c}">${c}.yaml</button>`).join("")}</div></div>`;
                }
                if (DATA.skipped?.length)
                    h += `<div class="vcard" style="grid-column:1/-1"><h4>Not traced (${DATA.skipped.length})</h4><p>These detection configs could not run on an image alone, so they have no diagram: ${DATA.skipped
                        .map((k) => `<span class="mono" title="${esc(k.reason)}">${esc(k.id)}</span>`)
                        .join(", ")}. Hover a name for the error.</p></div>`;
                h += `</div><div class="evohead"><b>Block × version</b><input id="evoq" placeholder="filter blocks…" value="${esc(S.evoq)}"/></div>`;
                h += `<div style="overflow:auto"><table class="matrix"><tr><th>block</th>${vers.map((v) => `<th>${esc(v.name)}</th>`).join("")}</tr>`;
                const q = S.evoq.toLowerCase(),
                    vn = versNames();
                const rows = Object.entries(DATA.catalog)
                    .filter(([k, c]) => c.versions.length && c.family !== "fn" && (c.file || ["Upsample", "ConvTranspose2d"].includes(k)))
                    .filter(([k, c]) => !q || k.toLowerCase().includes(q) || (c.doc || "").toLowerCase().includes(q))
                    .sort((a, b) => FAM_ORDER.indexOf(a[1].family) - FAM_ORDER.indexOf(b[1].family) || vn.indexOf(a[1].first) - vn.indexOf(b[1].first) || a[0].localeCompare(b[0]));
                let lastFam = null;
                for (const [k, c] of rows) {
                    if (c.family !== lastFam) {
                        h += `<tr class="grp"><td colspan="${vers.length + 1}">${FAM_LABEL[c.family] || c.family}</td></tr>`;
                        lastFam = c.family;
                    }
                    h += `<tr class="row ${S.evoBlock === k ? "on" : ""}" data-blk="${k}"><td>${famDot(c.family)}${k}</td>${vers
                        .map((v) => `<td>${c.versions.includes(v.name) ? `<span class="dot ${c.first === v.name ? "first" : ""}" title="${k} · ${v.name}"></span>` : ""}</td>`)
                        .join("")}</tr>`;
                }
                h += "</table></div>";
                const E = $("#evo");
                const st = E.scrollTop;
                E.innerHTML = h;
                E.scrollTop = st;
                E.querySelectorAll("[data-blk]").forEach((b) => (b.onclick = () => showBlock(b.dataset.blk)));
                E.querySelectorAll("[data-cfg]").forEach((b) => (b.onclick = () => go(b.dataset.cfg)));
                const inp = $("#evoq");
                inp.oninput = () => {
                    S.evoq = inp.value;
                    renderEvo();
                    const n = $("#evoq");
                    n.focus();
                    n.setSelectionRange(n.value.length, n.value.length);
                };
            }
            function showBlock(name) {
                const wasEvo = S.view === "evo";
                S.view = "evo";
                S.evoBlock = name;
                if (wasEvo) {
                    writeHash();
                    renderEvo();
                    renderPanel();
                } else render();
            }
            function evoPanel() {
                const name = S.evoBlock;
                if (!name)
                    return `<h2>Blocks &amp; evolution</h2><p>Each row is a module class that the detection configs actually build (every config, every scale). An orange dot marks the version whose configs use it first.</p><p class="muted">Pick a block to read its description and source, and to open each distinct internal wiring it has across versions.</p><h3>Legend</h3>${legendHTML()}`;
                const c = DATA.catalog[name];
                let h = `<h2>${esc(name)}</h2><p>${famDot(c.family)}${FAM_LABEL[c.family]}</p>` + blockInfoHTML(name, { open: true });
                if (c.structs.length) {
                    h += `<h3>Internal structures (${c.structs.length})</h3><p class="muted">Distinct wirings found across configs — flags such as shortcut, c3k or attn, or a different head design, change the structure.</p>`;
                    for (const k of c.structs) {
                        const b = DATA.blocks[k];
                        h += `<p><button class="btn" data-struct="${k}|${b.used[0]}">⤢ open</button> <span class="muted">${b.nodes.length} nodes · in</span> ${b.used.map((u) => `<span class="badge">${u}</span>`).join("")}</p>`;
                    }
                }
                h += `<h3>Configs using it</h3><p>${c.configs.map((x) => `<button class="chip" data-cfg="${x}">${x}</button>`).join(" ")}</p>`;
                return h;
            }

            /* ------------------------------------------------------------ deep links: #yolov8@4.0/3 (cards), #yolov8/4.0/3 (full view), #evo=C2f */
            function chainToHash(chain) {
                return chain.map((p, i) => (i === 0 && p.layer != null ? `${p.layer}.${p.vi}` : i === 0 ? p.j : p.j ?? p.from)).join("/");
            }
            function writeHash() {
                let h;
                if (S.view === "evo") h = "evo" + (S.evoBlock ? "=" + S.evoBlock : "");
                else if (S.path.length) h = `${S.cfg}${S.phase === "train" ? "" : "~" + S.phase}/${chainToHash(S.path)}`;
                else h = S.cfg + (S.phase === "train" ? "" : "~" + S.phase) + (S.cards.length ? "@" + S.cards.map((c, i) => (i === 0 ? `${c.layer}.${c.vi}` : c.from)).join("/") : "");
                history.replaceState(null, "", "#" + h);
            }
            function parseChain(cid, parts, asCards) {
                const out = [];
                let key = null;
                for (const [i, p] of parts.entries()) {
                    if (i === 0 && p.startsWith("k") && DATA.blocks[p.slice(1)]) {
                        key = p.slice(1);
                        out.push({ key, label: `${DATA.blocks[key].owner} (from catalog)`, layer: null, j: p });
                    } else if (i === 0) {
                        const [li, vi] = p.split(".").map(Number);
                        const l = cfgById[cid].layers[li];
                        if (!l || !V(l)[vi || 0]) break;
                        key = V(l)[vi || 0][0];
                        out.push({ key, label: `${l.i} · ${l.type}`, layer: li, vi: vi || 0, from: li });
                    } else {
                        const n = DATA.blocks[key]?.nodes[+p];
                        if (!n || !n.g) break;
                        key = n.g;
                        out.push(asCards ? { key, label: `${n.name ? n.name + " · " : ""}${n.type}`, from: +p } : { key, label: `${n.name} · ${n.type}`, j: +p });
                    }
                }
                return out;
            }
            function readHash() {
                const h = decodeURIComponent(location.hash.slice(1));
                S.path = [];
                S.cards = [];
                if (h.startsWith("evo")) {
                    S.view = "evo";
                    S.evoBlock = DATA.catalog[h.slice(4)] ? h.slice(4) : null;
                    return;
                }
                const at = h.indexOf("@");
                const [cidPh, ...parts] = (at >= 0 ? h.slice(0, at) : h).split("/");
                const [cid, ph] = cidPh.split("~");
                if (!cfgById[cid]) return;
                S.phase = cfgById[cid].phase_list.includes(ph) ? ph : "train";
                S.view = "arch";
                S.cfg = cid;
                if (at >= 0) {
                    S.cards = parseChain(cid, h.slice(at + 1).split("/"), true);
                    if (S.cards.length) S.focus = S.cards.length - 1;
                } else S.path = parseChain(cid, parts, false);
            }

            /* ------------------------------------------------------------ main */
            function render(keepView) {
                writeHash();
                renderHeader();
                renderSubbar();
                const evo = S.view === "evo";
                $("#evo").style.display = evo ? "block" : "none";
                svg.style.display = evo ? "none" : "block";
                $("#hint").style.display = evo ? "none" : "";
                document.querySelector(".zoom").style.display = evo ? "none" : "flex";
                if (evo) renderEvo();
                else {
                    const saved = { ...T };
                    if (S.path.length) renderFocus();
                    else renderArch(cfgById[S.cfg]);
                    if (keepView === true) {
                        T = saved;
                        applyT();
                    } else fit();
                    if (S.sel != null) NODES[S.sel]?.el?.classList.add("sel");
                    if (!S.path.length && S.focus != null) {
                        const f = S.focus;
                        S.focus = null;
                        const move = (t) => (keepView === true ? animateTo(t) : ((T = t), applyT()));
                        if (f === "main") move(fitWidth(lastMain));
                        else if (S.cards[f]?.abs) {
                            const c = S.cards[f].abs,
                                p = f > 0 ? S.cards[f - 1].abs : null;
                            const both = p ? { x: p.x, y: Math.min(p.y, c.y), w: c.x + c.w - p.x, h: Math.max(p.h, c.h) } : null;
                            const vb = both && viewFor(both, 1.05).k > 0.8 ? both : c;
                            move(viewFor({ x: vb.x - 20, y: vb.y - 20, w: vb.w + 40, h: vb.h + 40 }, 1.05));
                        }
                    }
                }
                renderPanel();
            }
            $("#viewseg")
                .querySelectorAll("button")
                .forEach(
                    (b) =>
                        (b.onclick = () => {
                            S.view = b.dataset.v;
                            render();
                        }),
                );
            $("#theme").onclick = () => {
                const r = document.documentElement;
                const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
                r.dataset.theme = dark ? "light" : "dark";
            };
            S.cfg = (cfgById[DATA.default] || DATA.configs[0]).id;
            readHash();
            window.addEventListener("hashchange", () => {
                readHash();
                render();
            });
            render();
        </script>
    </body>
</html>
