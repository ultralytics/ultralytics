# Lane B arm: yolo27-detr with its trunk replaced by the one from yolo26-ultravit-repmixer-fastvitffn-
# dinop5-depthmatched. Neck, decoder and scale_args are the baseline's, and the trunk's repeats and Conv channels are
# pre-divided against this family's multipliers. It therefore isolates the backbone.

nc: 80 # number of classes

scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1152]

# Per-scale variables resolved into module args as string tokens (see parse_model in tasks.py).
scale_args:
  s: { ndl: 3, efficient_ms: False }

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [3, True, 1e-05, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [3, True, 1e-05, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 7, RepUltraViTBlock, [3, True, 1e-05, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 3, MHSABlock, [0, 4, True, 1e-05, False, 64, False, True, True, True, 4]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 20 (P5/32-large)

  # RTDETRDecoderEfficient. Args (ch is auto-filled from `from` refs). Positional order:
  # [nc, hd, nq, ndp, nh, ndl, d_ffn, dropout, act, eval_idx, nd, label_noise_ratio, box_noise_scale,
  #  learnt_init_query, enable_cuda_acceleration, one_to_many_groups, efficient_ms, o2m_topk_mode, mlp_act].
  # `ndl` and `efficient_ms` are resolved per scale via `scale_args`. The three args this branch carries beyond
  # detr_decoder_clean2 are spelled at their no-op values, except mlp_act, which defaults to relu here and has
  # to say silu to keep the same MLPs.
  - [
      [14, 17, 20],
      1,
      RTDETRDecoderEfficient,
      [
        nc,
        256,
        300,
        4,
        8,
        ndl,
        2048,
        0.0,
        "silu",
        -1,
        100,
        0.5,
        1.0,
        False,
        False,
        0,
        efficient_ms,
        "unshared",
        "silu",
      ],
    ]
