# Classifier twin of the S plain-token-MLP backbone with balanced stage capacity.

nc: 1000

scales:
  s: [0.20, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [5.0, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 8, RepUltraViTBlock, [3.5, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 8, RepUltraViTBlock, [3.5, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 5, MHSABlock, [0, 4.0, True, 0.00001, False, 64]]

head:
  - [-1, 1, Classify, [nc]]
