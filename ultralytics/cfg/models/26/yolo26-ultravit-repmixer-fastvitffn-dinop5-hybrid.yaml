# Lane A detector for the DINO-P5 backbone, depth-hybrid scaling. Rows 0-8 match
# yolo26-ultravit-repmixer-fastvitffn-dinop5-hybrid-cls.yaml, its classifier twin.
# One P5 attention block at n and s, two at m and l, three at x, from round(8 * depth).
# P5 width is set per scale through max_channels rather than width, so only P5 and the head's last C3k2 move:
# 768 at l, spending the latency margin both baselines leave there.
# n caps at 1024 so head_dim 64 divides its P5. 704 and 832 are unavailable at l, the head's attention
# C3k2 needs a multiple of 128.
# s stays at 576 because widening it to 640 lost the conv baseline on Lane A, the only failing cell.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  # depth also sets the P5 attention block count via round(8 * depth): 1 at n and s, 2 at m and l, 3 at x.
  # n and s stay at 0.18 so they resolve to a single P5 block, the configuration that wins at those sizes.
  n: [0.18, 0.25, 1024]
  s: [0.18, 0.50, 1152]
  m: [0.25, 1.00, 512]
  l: [0.24, 1.00, 768]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 8, MHSABlock, [0, 4, True, 0.00001, False, 64, False, True, True, True, 4]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
