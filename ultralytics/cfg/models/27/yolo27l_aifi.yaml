# YOLO27l object detection model with P3/8 - P5/32 outputs.
# YOLO26-style CSP backbone and HybridEncoder neck with a 4-layer DeimDecoder head.
# Same backbone as yolo27l.yaml; only the neck differs (C3k2 FPN/PAN -> HybridEncoder).

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 512]

# YOLO26 CSP backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3/8 feature
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 P4/16 feature
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 P5/32 feature

# HybridEncoder neck + DeimDecoder
head:
  # Input projections + AIFI + FPN/PAN. hidden_dim=256.
  # Backbone P3/P4/P5 are at rows 4/6/10.
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 11 input_proj.2 (P5)
  - [-1, 1, AIFI, [1024, 8]] # 12
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 13 Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 15 input_proj.1 (P4)
  - [[-2, -1], 1, Add, []] # 16
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 17 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18 Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20 input_proj.0 (P3)
  - [[-2, -1], 1, Add, []] # 21
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 22 X3, fpn_blocks.1

  - [-1, 1, SCDown, [256, 3, 2, False]] # 23 downsample_convs.0
  - [[-1, 18], 1, Add, []] # 24
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 25 F4, pan_blocks.0

  - [-1, 1, SCDown, [256, 3, 2, False]] # 26 downsample_convs.1
  - [[-1, 13], 1, Add, []] # 27
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 28 F5, pan_blocks.1

  # DeimDecoder. Args (ch is auto-filled from `from` refs). Positional order:
  # [nc, hd, nq, ndp, nh, ndl, d_ffn, dropout, act, eval_idx, nd, label_noise_ratio, box_noise_scale,
  #  learnt_init_query, reg_max, reg_scale, layer_scale, mlp_act,
  #  o2m_topk_mode, use_gateway, share_bbox_head, share_score_head]
  - [[22, 25, 28], 1, DeimDecoder, [nc, 256, 300, [3, 6, 3], 8, 4, 2048, 0.0, "silu", -1, 100, 0.5, 1.0, False, 32, 4.0, 1.0, "silu", "unshared", True, False, False]] # 29
