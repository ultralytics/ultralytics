# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# P4 detection head is removed; stacks two independent P8-quality levers:
# topdown-path width (wide-topdown ~0.469 @ 1.1 ms) + SNI x0.5 damping on
# upsampled features before fusion (Rethinking-FPN, zero cost).
# Backbone P3 stage C3k2 expansion is per-scale via the `bbp3e` scales arg:
# e=0.5 at n/s (bbp3e5 recipe, latency-free there), e=0.25 at m/l/x.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels, {named per-scale args}]
  n: [0.50, 0.25, 1024, {bbp3e: 0.5}]
  s: [0.50, 0.50, 1024, {bbp3e: 0.5}]
  m: [0.50, 1.00, 512, {bbp3e: 0.25}]
  l: [1.00, 1.00, 512, {bbp3e: 0.25}]
  x: [1.00, 1.50, 512, {bbp3e: 0.25}]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, bbp3e]] # 4 backbone P3 stage: e=0.5 at n/s (bbp3e5), 0.25 at m/l/x
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # 12 SNI damping
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [768, True]] # 14 widened intermediate P4/16 (top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # 16 SNI damping
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [384, True]] # 18 widened P3/8-small

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat intermediate P4
  - [-1, 2, C3k2, [512, True]] # 21 intermediate P4/16 (NOT widened)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 (P5/32-large)

  - [[18, 24], 1, Segment26, [nc, 32, 256]] # Detect(P3, P5)
