# Objects365v1 pretrain args read from yolo27s-obj365-l-c3k2-muon.pt (`s-light-muon-0.5-sgd-0.5-150`,
# project YOLO27-obj365-new), which reached 23.90 mAP50-95 at epoch 150 on yolo26s-p4p5-wide-slim19.yaml
# from a c3k2_s.pt init. MuSGD 0.5/0.5 at lr0 0.01 b128, near-default aug, 2 warmup epochs.
# `optimizer: auto` in the source resolves to MuSGD there. Ours would pick AdamW, so it is named here.
# Known infidelities: bf16 AMP (ours is fp16), and cls_norm tss / cls_lr_mult / dup_sup / o2f / dup_margin
# are not args on this branch. No grad_clip key: main() passes it. end2end stays unset, as in the source.
auto_augment: randaugment
backbone_lr_ratio: 1.0
batch: 128
box: 7.5
close_mosaic: 10
cls: 0.5
copy_paste: 0.15
copy_paste_mode: flip
cos_lr: false
cutmix: 0.0
degrees: 0.0
dfl: 6.0
epochs: 150
erasing: 0.4
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
imgsz: 640
kobj: 1.0
lr0: 0.01
lrf: 0.01
mixup: 0.05
momentum: 0.937
mosaic: 1.0
muon: 0.5
nbs: 64
optimizer: MuSGD
patience: 100
pose: 12.0
scale: 0.9
sgd: 0.5
shear: 0.0
translate: 0.1
warmup_bias_lr: 0.0
warmup_epochs: 2
warmup_momentum: 0.8
weight_decay: 0.0005
