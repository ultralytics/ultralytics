name: Debug OpenVINO
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant"
        default: "main"
jobs:
  Repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install --system -e ".[export-base]" pytest pytest-xdist --torch-backend cpu
      - run: lscpu | grep -E "Model name|Flags" | cut -c1-400
      - run: |
          PYTHONFAULTHANDLER=1 timeout 600 python -m pytest -vv -s --slow -p no:cacheprovider \
            "tests/test_exports.py::test_export_openvino_matrix[detect-True-8-2-False-True]" \
            "tests/test_exports.py::test_export_openvino_matrix[detect-True-8-1-False-True]" \
            "tests/test_exports.py::test_export_openvino_matrix[detect-False-8-2-False-True]" \
            "tests/test_exports.py::test_export_openvino_matrix[detect-True-16-2-False-True]" 2>&1 | tail -60
