# Lane A DINO-P5 detector, stage-balanced scaling, one yaml covering n through x.
# Every P stage carries more backbone parameters than both the yolo26 conv baseline and the yolo27 baseline of its
# scale, and total parameters clear the conv baseline at every scale. The incumbent depth-hybrid yaml did not: it ran
# P2 at 0.47x to 0.76x and P3 at 0.31x to 0.49x of the conv baseline, having moved that capacity into P5, which is the
# standing suspicion behind its AP_small deficit.
# The capacity is paid for by shrinking P4 raw repeats from 20 to 8, P5 raw repeats from 8 to 3 and P5 raw channels
# from 1152 to 768, then widening P2 and P3 instead. P5 buys its capacity through width, which is free per scale, not
# depth, which is not: `depth` is one scalar setting every stage's block count at once, so a raw repeat large enough
# to give n two P5 blocks gives x seven.
# n and s take max_channels 1024 rather than 768 because the cap also bounds the head's final C3k2, so trimming P5
# there drops total parameters under the conv baseline. l takes 848 with width 0.75, which resolves that head to 640.
# Divisibility: P5 needs a multiple of 64 for head_dim 64, and the head's attention C3k2 needs a multiple of 128.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  # depth sets P5 blocks via round(3 * depth): 1 at n, s, m and l, 2 at x.
  n: [0.11, 0.25, 1024]
  s: [0.11, 0.50, 1024]
  m: [0.35, 0.6666666666666666, 768]
  l: [0.35, 0.75, 848]
  x: [0.50, 1.00, 768]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 P1/2 stem
  - [-1, 1, Conv, [152, 3, 2]] # 1 P2/4 stem
  - [-1, 9, RepUltraViTBlock, [3, True, 0.00001, True]] # 2 stage1 P2/4
  - [-1, 1, Conv, [352, 3, 2]] # 3 P3/8 downsample
  - [-1, 9, RepUltraViTBlock, [3, True, 0.00001, True]] # 4 stage2 P3/8
  - [-1, 1, Conv, [672, 3, 2]] # 5 P4/16 downsample
  - [-1, 8, RepUltraViTBlock, [3, True, 0.00001, True]] # 6 stage3 P4/16
  - [-1, 1, Conv, [768, 3, 2]] # 7 P5/32 downsample
  - [-1, 3, MHSABlock, [0, 8.5, True, 0.00001, False, 64, False, True, True, True, 4]] # 8 stage4 P5/32 dinop5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10
  - [-1, 2, C3k2, [512, True]] # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [256, True]] # 14 P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16
  - [-1, 2, C3k2, [512, True]] # 17 P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 20 P5/32
  - [[14, 17, 20], 1, Detect, [nc]] # 21
