# COCO8-pose3d: the 8 COCO8-pose images relabelled for the pose3d task.
# WARNING: the depth channel in this set is SYNTHETIC, not pseudo-labelled. It exists to exercise the plumbing
# (label parsing, augmentation, loss, metrics), not to train anything. Build it with
# `python the pose3d-research branch, research/src/make_coco8_pose3d.py`, and see the pose3d-research branch, research/design/pose3d-task-design.md for the real pipeline.
# Example usage: yolo train task=pose3d data=coco8-pose3d.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco8-pose3d ← generated here

path: coco8-pose3d # dataset root dir
train: images/train # train images (relative to 'path') 4 images
val: images/val # val images (relative to 'path') 4 images
test: # test images (optional)

# Keypoints. Joints 0-16 are COCO-17 with root-relative depth; joint 17 is the root (mid-hip) and its depth
# channel holds the person's absolute depth. Both depth channels are encoded to [0, 1], see utils/pose3d.py.
kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas: [0.026, 0.025, 0.025, 0.035, 0.035, 0.079, 0.079, 0.072, 0.072, 0.062, 0.062, 0.107, 0.107, 0.087, 0.087, 0.089, 0.089, 0.107]

# Assumed pinhole focal as a multiple of the longer image side, used to lift pixels to metres at validation.
# 1.1 is the pseudo-focal convention of CLIFF and HMR2.0, for datasets that ship no intrinsics.
focal_ratio: 1.1

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
