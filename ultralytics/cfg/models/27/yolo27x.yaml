# Ultralytics YOLO27x object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo27
# Task docs: https://docs.ultralytics.com/tasks/detect
# UltraViT backbone and HybridEncoder neck with a 6-layer DeimDecoder head.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  x: [0.35, 1.50, 512]

# YOLO27x backbone
backbone:
  # [from, repeats, module, args]
  # RepMixer stages 1-3 use the FastViT ConvFFN; Attn2 MHSA forms stage 4.
  - [-1, 1, Conv, [64, 3, 2]] # 0 P1/2 stem
  - [-1, 1, Conv, [96, 3, 2]] # 1 P2/4 stem
  - [-1, 5, RepUltraViTBlock, [3, True, 1.0e-5, True]] # 2 stage 1 P2/4
  - [-1, 1, Conv, [192, 3, 2]] # 3 P3/8 downsample
  - [-1, 5, RepUltraViTBlock, [3, True, 1.0e-5, True]] # 4 P3/8
  - [-1, 1, Conv, [384, 3, 2]] # 5 P4/16 downsample
  - [-1, 20, RepUltraViTBlock, [3, True, 1.0e-5, True]] # 6 P4/16
  - [-1, 1, Conv, [1152, 3, 2]] # 7 P5/32 downsample
  - [-1, 8, MHSABlock, [0, 4, True, 1.0e-5, True, 32]] # 8 P5/32

# YOLO27x head
head:
  # Input projections + AIFI + FPN/PAN. hidden_dim=256.
  # Backbone P3/P4/P5 are at rows 4/6/8.
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9 input_proj.2 (P5)
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 11 Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 13 input_proj.1 (P4)
  - [[-2, -1], 1, Add, []] # 14
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 15 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 16 Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18 input_proj.0 (P3)
  - [[-2, -1], 1, Add, []] # 19
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 20 X3, fpn_blocks.1

  - [-1, 1, SCDown, [256, 3, 2, False]] # 21 downsample_convs.0
  - [[-1, 16], 1, Add, []] # 22
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 23 F4, pan_blocks.0

  - [-1, 1, SCDown, [256, 3, 2, False]] # 24 downsample_convs.1
  - [[-1, 11], 1, Add, []] # 25
  - [-1, 1, RepNCSPELAN5, [256, 512, 160, 4]] # 26 F5, pan_blocks.1

  # DeimDecoder. Args (ch is auto-filled from `from` refs). Positional order:
  # [nc, hd, nq, ndp, nh, ndl, d_ffn, dropout, act, eval_idx, nd, label_noise_ratio, box_noise_scale,
  #  learnt_init_query, reg_max, reg_scale, layer_scale, mlp_act,
  #  o2m_topk_mode, use_gateway, share_bbox_head, share_score_head]
  - [[20, 23, 26], 1, DeimDecoder, [nc, 256, 300, [3, 6, 3], 8, 6, 2048, 0.0, "silu", -1, 100, 0.5, 1.0, False, 32, 4.0, 1.0, "silu", "unshared", True, False, False]] # 27
