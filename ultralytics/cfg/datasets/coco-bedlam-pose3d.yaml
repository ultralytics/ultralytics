# COCO-pose3d-refocal + BEDLAM-pose3d-smplx, 1:1 by images: the teacher-labelled real photos (56,599) and every 5th
# frame of BEDLAM's non-stadium scenes (56,514), whose 3D joints are SMPL-X ground truth. Both in the declared
# focal = 1.2 * max(w, h) convention. BEDLAM's list comes first so the merged label cache lands in its labels dir and
# never overwrites coco-pose3d-refocal's own cache. Validation is COCO val2017, as for F_clip.
# Example usage: yolo train task=pose3d data=coco-bedlam-pose3d.yaml

path: /home/rick/coco-pose3d-refocal
train:
  - /home/rick/bedlam-pose3d-smplx/train_mix5.txt # absolute image paths, every 5th line of train_nostadium.txt
  - train2017.txt
val: val2017.txt
test:

kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas: [0.026, 0.025, 0.025, 0.035, 0.035, 0.079, 0.079, 0.072, 0.072, 0.062, 0.062, 0.107, 0.107, 0.087, 0.087, 0.089, 0.089, 0.107]

# Declared, not assumed. SAM 3D Body keys its focal to the image DIAGONAL (measured f/diagonal = 1.0000,
# sd 0.0000), which makes diagonal/max(w, h) — and therefore the depth target — vary 1.147-1.414 with aspect
# ratio alone, noise the network cannot see after letterboxing. refocal_labels.py rescales every depth onto
# this single declared ratio so the target is a function of the image the network actually receives.
focal_ratio: 1.2

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
