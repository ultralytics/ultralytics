# 020826-1 N port with the P3 conv stage doubled to 2x C3k2 (39K vs conv 26K), spending the latency allowance
# directly on the small-object bucket, the nano arm's largest relative deficit.

nc: 80
end2end: True
reg_max: 1

scales:
  n: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [1.25, True, 0.00001, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, MHSABlock, [0, 3.8125, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [64, True]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
