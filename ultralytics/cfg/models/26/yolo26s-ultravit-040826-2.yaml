# 020826-1 with the P5 FFN widened, mlp 0.625 -> 1.5 (hidden 320 -> 768). The 0.625 ratio was a param-floor
# artifact leaving the FFN starved next to the 1.05M attention. P5 runs 400 tokens at 640, so extra GEMMs there
# are the cheapest capacity in the trunk (DINOv3 S->S+ grows only the attention-stage FFN). Stem-P4 stay 020826-1.

nc: 80
end2end: True
reg_max: 1

scales:
  s: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [1.25, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 1.5, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
