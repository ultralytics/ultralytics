name: Validate Windows OpenVINO fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 43944221ca14546e87dce6f5eb2e26269684aaff
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: "3.13"
      - run: uv pip install --system -e ".[export-openvino]" openvino==2026.4.0 pytest pytest-cov pytest-xdist --torch-backend cpu
      - name: Run existing OpenVINO regression tests and native backend smoke
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          import openvino as ov
          from ultralytics import YOLO, settings
          repo = Path.cwd()
          print("CPU:", ov.Core().get_property("CPU", "FULL_DEVICE_NAME"), flush=True)
          assert "ONEDNN_MAX_CPU_ISA" not in os.environ
          directory = tempfile.mkdtemp()
          settings.update({"weights_dir": str(Path(directory, "weights"))})
          subprocess.run([
              sys.executable, "-m", "pytest", "-q", "--slow", "--export-env", "base",
              str(repo / "tests/test_exports.py") + "::test_export_openvino_matrix[detect-False-8-1-False]",
              str(repo / "tests/test_exports.py") + "::test_export_openvino_matrix[detect-True-8-1-False]",
          ], cwd=directory, check=True)
