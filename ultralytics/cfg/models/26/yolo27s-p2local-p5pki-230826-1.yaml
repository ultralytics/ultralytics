# YOLO27-S with local P2 detail and residual-safe poly-kernel P5 context.

nc: 80
end2end: True
reg_max: 1
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  # Keep the P2 path local: matched O365 trajectories favor plain P2 detail over context-gated P2.
  - [2, 1, Conv, [64, 3, 2]]
  - [14, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 4, 15], 1, Concat, [1]]
  - [-1, 3, C3k2, [384, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  # Restore learned P5 fusion before context. PKINet's stage projects first, then applies same-channel PKI blocks.
  - [-1, 1, C3k2, [640, True]]
  # PKINet Sections 3.2-3.3 and source lines 142-273: apply poly-kernel context only after channel alignment,
  # retaining the source bottleneck's equal-channel identity path for Medium/Large recognition.
  # https://openaccess.thecvf.com/content/CVPR2024/papers/Cai_Poly_Kernel_Inception_Network_for_Remote_Sensing_Detection_CVPR_2024_paper.pdf#page=4
  # https://github.com/PKINet/PKINet/blob/c2ee525025a330b9a943be9b791d99017837b325/mmrotate/models/backbones/pkinet.py#L142-L273
  - [-1, 1, PKIContext, [640]]
  - [-1, 1, Conv, [1024, 1, 1]]
  - [[19, 22, 27], 1, Detect, [nc]]
