# 3DPW-pose3d train+validation: real-ground-truth 3D for TRAINING, converted by research/src/convert_3dpw.py.
# The held-out benchmark stays 3dpw-pose3d-r12.yaml (the test split), which shares no sequence with these two.
# Training on this makes the benchmark in-domain — same camera, same actors in some sequences — so it no longer
# measures cross-domain transfer the way it did for R0/H2/H6. Report fine-tuned and non-fine-tuned numbers
# separately, or the H2-style split that made the augmentation mechanism visible will be invisible.
# Every 2nd frame: 12,764 frames, 16,352 persons.
# Example usage: yolo train task=pose3d data=3dpw-pose3d-trainval.yaml

path: /home/rick/3dpw-pose3d-trainval # dataset root; same path on every Shenzhen box
train: train.txt # 24 sequences, 8,828 frames
val: validation.txt # 12 sequences, 3,936 frames — disjoint from both train and test
test:

# Keypoints. Joints 0-16 are COCO-17 carrying root-relative depth; joint 17 is the root (mid-hip) and its depth
# channel holds the person's absolute depth. Both depth channels are encoded to [0, 1], see utils/pose3d.py.
# Only the 12 joints SMPL-24 shares with COCO-17 carry ground truth; the five face joints are written with
# visibility 0, so the loss and MPJPE skip them and they are supervised by COCO alone when the sets are mixed.
kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas:
  [
    0.026,
    0.025,
    0.025,
    0.035,
    0.035,
    0.079,
    0.079,
    0.072,
    0.072,
    0.062,
    0.062,
    0.107,
    0.107,
    0.087,
    0.087,
    0.089,
    0.089,
    0.107,
  ]

# Written in the declared convention, not 3DPW's own. The true intrinsics give fx/max(w, h) = 1.0239; the
# depths here have been multiplied by 1.2 * max(w, h) / fx (mean 1.174) so they share one unit with
# coco-pose3d-refocal. Mixing sets in two conventions would put two different metres on the same regressor.
focal_ratio: 1.2

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
