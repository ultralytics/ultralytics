# COCO-pose3d: COCO person images with real boxes and SAM 3D Body pseudo-labelled 3D keypoints.
# Boxes and the set of people come from COCO's own annotations, so detection supervision is real ground truth;
# only the 3D is distilled. Built by research/src/pseudo_label_sam3d.py, audited by check_pseudo_labels.py.
# Example usage: yolo train task=pose3d data=coco-pose3d.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco-pose3d ← images/ symlink COCO, labels/ are generated

path: /data/rick/coco-pose3d # dataset root dir (ultra11, where the teacher runs)
train: train2017.txt # image list, only images that actually carry a pseudo-label
val: val2017.txt
test:

# Keypoints. Joints 0-16 are COCO-17 carrying root-relative depth; joint 17 is the root (mid-hip) and its depth
# channel holds the person's absolute depth. Both depth channels are encoded to [0, 1], see utils/pose3d.py.
kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas: [0.026, 0.025, 0.025, 0.035, 0.035, 0.079, 0.079, 0.072, 0.072, 0.062, 0.062, 0.107, 0.107, 0.087, 0.087, 0.089, 0.089, 0.107]

# Assumed pinhole focal as a multiple of the longer image side, used to lift pixels to metres at validation.
# SAM 3D Body has no FOV estimator enabled and falls back to a default FOV that measures ~1.2x the image side
# on COCO, so this is close to the teacher's own assumption rather than an independent guess.
focal_ratio: 1.1

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
