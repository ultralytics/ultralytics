# COCO post-objv1 fine-tune, a literal copy of the shipped yolo26{size}.pt train_args.
# `_shipped_from` pulls per-size aug, wd, muon/sgd and batch-scaled lr0/nbs/warmup from the
# checkpoint, so only the keys it omits live here. --batch 64 halves lr0/nbs/warmup with it,
# same effective LR at half the memory.
_shipped_from: yolo26{size}.pt
_epochs_by_scale: { n: 245, s: 70, m: 80, l: 60, x: 40 }
backbone_lr_ratio: 1.0
batch: 128
close_mosaic: 10
end2end: true
imgsz: 640
kobj: 1.0
optimizer: MuSGD
patience: 100
pose: 12.0
