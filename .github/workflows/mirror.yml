name: Restore GitLab profile banner (one time)
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  profiles:
    if: github.repository == 'ultralytics/ultralytics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh GitLab group and prepare profile README
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import urllib.parse
          token = os.environ["GITLAB_TOKEN"]
          def gitlab(endpoint, method="GET", avatar=None, **data):
              body = json.dumps(data).encode() if data else None
              content_type = "application/json"
              if avatar is not None:
                  boundary = "ultralytics-avatar"
                  content_type = f"multipart/form-data; boundary={boundary}"
                  body = (
                      f'--{boundary}\r\nContent-Disposition: form-data; name="avatar"; filename="logo.png"\r\n'
                      'Content-Type: image/png\r\n\r\n'
                  ).encode() + avatar + f"\r\n--{boundary}--\r\n".encode()
              request = urllib.request.Request(
                  f"https://gitlab.com/api/v4/{endpoint}",
                  data=body,
                  headers={"PRIVATE-TOKEN": token, "Content-Type": content_type},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return None if response.status == 204 else json.load(response)


          endpoint = "projects/54400893/merge_requests/2"
          expected = "9c966e3e421f53a73feb77f0b9226d7a35ab3eeb"
          mr = gitlab(endpoint)
          assert mr["sha"] == expected
          assert mr["detailed_merge_status"] == "mergeable"
          assert mr["blocking_discussions_resolved"]
          assert not mr.get("head_pipeline") or mr["head_pipeline"]["status"] == "success"
          approvals = gitlab(f"{endpoint}/approvals")
          assert approvals["approvals_left"] == 0
          result = gitlab(f"{endpoint}/merge", "PUT", sha=expected, should_remove_source_branch=True)
          assert result["state"] == "merged"
          print("Merged reviewed profile README:", result["web_url"])
