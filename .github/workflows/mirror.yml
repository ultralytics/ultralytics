# Mirror all public Ultralytics repositories to GitLab daily or on manual dispatch.

name: Mirror Repositories to GitLab

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC

jobs:
  gitlab:
    if: github.repository == 'ultralytics/ultralytics'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: gitlab-mirror
      cancel-in-progress: false
    steps:
      - name: Mirror public repositories to GitLab
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }} # GitLab api scope; Maintainer access to destination projects
          GIT_TERMINAL_PROMPT: "0"
        shell: python
        run: |
          import json
          import os
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["GITLAB_TOKEN"]
          if not token:
              raise SystemExit("Set the GITLAB_TOKEN Actions secret with GitLab api scope and project creation access.")

          def gitlab(path, method="GET", **data):
              request = urllib.request.Request(
                  f"https://gitlab.com/api/v4/{path}",
                  data=json.dumps(data).encode() if data else None,
                  headers={"PRIVATE-TOKEN": token, "Content-Type": "application/json"},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          repositories = json.loads(subprocess.check_output([
              "gh", "api", "--paginate", "--slurp", "orgs/ultralytics/repos?type=public&per_page=100"
          ]))
          group = gitlab("groups/ultralytics")["id"]
          failures = []
          for repo in (repo for page in repositories for repo in page):
              name = repo["name"]
              slug = "github" if name == ".github" else name
              print(f"::group::{name}", flush=True)
              try:
                  try:
                      project = gitlab(f"projects/ultralytics%2F{slug}")
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      project = gitlab("projects", "POST", name=slug, path=slug, namespace_id=group,
                                       visibility="public", builds_access_level="disabled")
                  with tempfile.TemporaryDirectory() as directory:
                      def git(*args):
                          subprocess.run(["git", "-C", directory, *args], check=True, timeout=3600)

                      git("init", "--bare")
                      git("remote", "add", "origin", repo["clone_url"])
                      git("fetch", "origin", "+refs/heads/*:refs/heads/*", "+refs/tags/*:refs/tags/*")
                      git("remote", "add", "gitlab", f"https://gitlab.com/ultralytics/{slug}.git")
                      git("config", "credential.https://gitlab.com.helper",
                          '!f() { echo username=oauth2; echo "password=$GITLAB_TOKEN"; }; f')
                      git("config", "lfs.url", f"{repo['clone_url']}/info/lfs")
                      git("config", "lfs.pushurl", f"https://gitlab.com/ultralytics/{slug}.git/info/lfs")
                      git("lfs", "fetch", "--all", "origin")
                      git("lfs", "push", "--all", "gitlab")
                      # Create the source default branch before selecting it, so pruning can delete an old default.
                      default = repo["default_branch"]
                      if subprocess.check_output(["git", "-C", directory, "for-each-ref", "refs/heads/"]).strip():
                          git("push", "gitlab", f"+refs/heads/{default}:refs/heads/{default}")
                          if project["default_branch"] != default:
                              gitlab(f"projects/{project['id']}", "PUT", default_branch=default)
                      git("push", "--atomic", "--prune", "gitlab", "+refs/heads/*:refs/heads/*", "+refs/tags/*:refs/tags/*")
                  print(f"Mirrored {name}", flush=True)
              except Exception as error:
                  failures.append(name)
                  print(f"::error::Failed to mirror {name}: {error}", flush=True)
              finally:
                  print("::endgroup::", flush=True)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              f"GitLab mirror: {sum(map(len, repositories)) - len(failures)} succeeded; {len(failures)} failed.\n"
              + "".join(f"- Failed: {name}\n" for name in failures)
          )
          if failures:
              raise SystemExit("Some mirrors failed; inspect their logs, including GitLab branch/tag protection rules.")
      # Future mirrors: add a source checkout before enabling these placeholders.
      # - name: Push to Gitee
      #   run: |
      #     git remote add gitee https://ultralytics:${{ secrets.GITEE_TOKEN }}@gitee.com/ultralytics/ultralytics.git
      #     git push gitee main --force
