# The combined pose3d training set: COCO person images with SAM 3D Body pseudo-labels, plus 3DPW's real
# IMU+video ground truth. Both halves are written in the one declared focal convention below, which is the
# only reason they can share a regressor — see research/findings.md on H6.
#   coco-pose3d-refocal  56,599 images / 149,813 persons  pseudo-labelled 3D, real COCO boxes
#   3dpw-pose3d-trainval 12,764 frames / 16,352 persons   real 3D, 36 sequences, every 2nd frame
# Validation is the held-out 3DPW *test* split, which shares no sequence with the training half.
# Example usage: yolo train task=pose3d data=coco-3dpw-pose3d.yaml

path: /home/rick # the lists below are absolute; each resolves its own ./ entries against its own directory
train:
  - /home/rick/coco-pose3d-refocal/train2017.txt
  - /home/rick/3dpw-pose3d-trainval/train.txt
  - /home/rick/3dpw-pose3d-trainval/validation.txt
val: /home/rick/3dpw-pose3d-r12/test.txt
test:

# Keypoints. Joints 0-16 are COCO-17 carrying root-relative depth; joint 17 is the root (mid-hip) and its depth
# channel holds the person's absolute depth. Both depth channels are encoded to [0, 1], see utils/pose3d.py.
kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas:
  [
    0.026,
    0.025,
    0.025,
    0.035,
    0.035,
    0.079,
    0.079,
    0.072,
    0.072,
    0.062,
    0.062,
    0.107,
    0.107,
    0.087,
    0.087,
    0.089,
    0.089,
    0.107,
  ]

# Declared, and identical for both halves: focal = 1.2 * max(w, h). The COCO labels are re-keyed onto it from
# the teacher's diagonal focal by research/src/refocal_labels.py; the 3DPW labels are written onto it directly
# from the real intrinsics by research/src/convert_3dpw.py --focal-ratio 1.2.
focal_ratio: 1.2

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
