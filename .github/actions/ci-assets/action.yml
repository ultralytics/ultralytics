# The one owner of CI test assets: restores the cross-OS weights and datasets cache that tests/cache_test_assets.py
# builds, so jobs never download them from GitHub Releases one by one. Workspace-relative paths because actions/cache
# rejects '..'; the key changes only with the manifest, so a manifest change rebuilds the cache from scratch.

name: CI assets
description: Restore the shared CI weights and datasets cache, or build it in the Assets job

inputs:
  build:
    description: Download and save the cache when it is missing (only the Assets job builds it)
    default: "false"
  configure:
    description: Point Ultralytics settings at the restored dirs (false when they are mounted into containers)
    default: "true"

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          weights
          datasets
        key: ci-assets-${{ hashFiles('tests/cache_test_assets.py', 'tests/__init__.py') }}
        enableCrossOsArchive: true
        lookup-only: ${{ inputs.build }}
        fail-on-cache-miss: ${{ inputs.build != 'true' }}
    - if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: ultralytics/actions/setup-uv@main
      with:
        python-version: "3.13"
        activate-environment: true
    - if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: ultralytics/actions/retry@main
      with:
        retries: 2
        retry_delay_seconds: 60
        timeout_minutes: 30
        run: |
          uv pip install -e . "git+https://github.com/ultralytics/CLIP.git" --torch-backend cpu
          yolo settings weights_dir="${GITHUB_WORKSPACE}/weights" datasets_dir="${GITHUB_WORKSPACE}/datasets"
          python tests/cache_test_assets.py
    - if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          weights
          datasets
        key: ${{ steps.cache.outputs.cache-primary-key }}
        enableCrossOsArchive: true
    - if: inputs.build != 'true' && inputs.configure == 'true'
      shell: bash # for Windows compatibility
      run: yolo settings weights_dir="${GITHUB_WORKSPACE}/weights" datasets_dir="${GITHUB_WORKSPACE}/datasets"
