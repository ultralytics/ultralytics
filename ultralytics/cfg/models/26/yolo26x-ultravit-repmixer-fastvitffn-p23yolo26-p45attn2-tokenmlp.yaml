# X-only backbone matching YOLO26X at P2-P3 and FastViT-FFN + Attn2 at P4-P5.

nc: 80
end2end: True
reg_max: 1

scales:
  x: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 1, Conv, [144, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [5.0, True, 0.00001, True]]
  - [-1, 1, Conv, [288, 3, 2]]
  - [-1, 3, RepUltraViTBlock, [4.944445, True, 0.00001, True]]
  - [-1, 1, Conv, [576, 3, 2]]
  - [-1, 4, RepUltraViTBlock, [5.305556, True, 0.00001, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 2, MHSABlock, [0, 7.052084, True, 0.00001, False, 64, False, False, False, False, 0]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [384, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
