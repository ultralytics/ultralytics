# 020826-1 with P4 deepened 5 to 8 blocks (843K, near the level where medium AP reached conv parity).
# Spends the +10% latency allowance on the medium bucket after the conv P2/P3 rows target the small bucket.
# No attn2 components, all blocks export TRT fp16 clean.

nc: 80
end2end: True
reg_max: 1

scales:
  s: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 8, RepUltraViTBlock, [1.25, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 0.625, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
