# M port of the 020826-1 pattern: literal YOLO26-M conv rows at stem through P3 (the M RepMixer arm's largest
# relative deficit is AP_small, 28.7 vs 31.6, and the small-object fix is the block type, not the budget),
# P4 and P5 kept from 290726-M resolved at m depth (2x RepUltraViT@384 mlp 4.25, single MHSA@512 mlp 4.75).
# Conv rows measured cheaper on TRT than the RepMixer stages they replace at S, so latency should hold or improve
# on 290726-M's -2.44% lane A.

nc: 80
end2end: True
reg_max: 1

scales:
  m: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [4.25, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 4.75, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
