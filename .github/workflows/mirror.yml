# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license
name: Refresh GitLab profiles (one time)
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  profiles:
    if: github.repository == 'ultralytics/ultralytics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh GitLab group and prepare profile README
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import urllib.parse
          token = os.environ["GITLAB_TOKEN"]
          def gitlab(endpoint, method="GET", avatar=None, **data):
              body = json.dumps(data).encode() if data else None
              content_type = "application/json"
              if avatar is not None:
                  boundary = "ultralytics-avatar"
                  content_type = f"multipart/form-data; boundary={boundary}"
                  body = (
                      f'--{boundary}\r\nContent-Disposition: form-data; name="avatar"; filename="logo.png"\r\n'
                      'Content-Type: image/png\r\n\r\n'
                  ).encode() + avatar + f"\r\n--{boundary}--\r\n".encode()
              request = urllib.request.Request(
                  f"https://gitlab.com/api/v4/{endpoint}",
                  data=body,
                  headers={"PRIVATE-TOKEN": token, "Content-Type": content_type},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return None if response.status == 204 else json.load(response)


          user = gitlab("user")
          assert user["username"] == "glenn-jocher", "Unexpected token owner"
          print("Current public profile:", json.dumps({key: user.get(key) for key in ["username", "name", "bio", "website_url", "organization", "job_title", "github", "web_url"]}))
          description = 'Ultralytics makes vision AI accessible with open-source YOLO models and tools for training, validation, and deployment.\n\n[Website](https://www.ultralytics.com/) · [Docs](https://docs.ultralytics.com/) · [Platform](https://platform.ultralytics.com/)\n\nOfficial GitLab mirrors. Development, issues, and pull requests: [GitHub](https://github.com/ultralytics).'
          gitlab("groups/ultralytics", "PUT", description=description)
          assert gitlab("groups/ultralytics")["description"] == description
          print("Group description updated and verified")
          project = gitlab("projects/ultralytics%2Fgitlab-profile")
          endpoint = f"projects/{project['id']}"
          readme = '<p align="center">\n  <a href="https://www.ultralytics.com/">\n    <img src="https://raw.githubusercontent.com/ultralytics/assets/main/logo/Ultralytics-logomark-color.png" width="120" alt="Ultralytics">\n  </a>\n</p>\n\n# Ultralytics\n\nWe make vision AI accessible with open-source YOLO models and tools for training, validation, and deployment. Build computer vision applications with [Ultralytics YOLO](https://docs.ultralytics.com/) and manage datasets, training, and deployment with [Ultralytics Platform](https://platform.ultralytics.com/).\n\n## Get started\n\n- [Documentation](https://docs.ultralytics.com/) — installation, tutorials, models, and integrations.\n- [Ultralytics Platform](https://platform.ultralytics.com/) — annotate, train, and deploy.\n- [GitHub](https://github.com/ultralytics) — source repositories and development.\n- [Community](https://community.ultralytics.com/) — questions, ideas, and shared projects.\n- [Website](https://www.ultralytics.com/) — products, solutions, and company information.\n- [Licensing](https://www.ultralytics.com/license) — open-source and enterprise licensing options.\n\n## Contribute\n\nThese are official GitLab mirrors of our public GitHub repositories. GitHub is the source of truth for branches and tags. Please open issues and pull requests in the corresponding [GitHub repository](https://github.com/ultralytics); see our [contributing guide](https://docs.ultralytics.com/help/contributing/) to get involved.\n'
          branch = "automation/evergreen-profile-20260917"
          commit = gitlab(f"{endpoint}/repository/commits", "POST", branch=branch,
                         start_branch=project["default_branch"], commit_message="Refresh evergreen Ultralytics GitLab profile",
                         actions=[{"action": "update", "file_path": "README.md", "content": readme}])
          mr = gitlab(f"{endpoint}/merge_requests", "POST", source_branch=branch,
                      target_branch=project["default_branch"], title="Refresh evergreen Ultralytics GitLab profile",
                      description="Replace dated GitHub-specific copy with evergreen Ultralytics messaging, the U logomark, current product and community links, and clear GitHub contribution routing.",
                      remove_source_branch=True)
          print("Profile README review:", mr["web_url"], "head:", commit["id"])
