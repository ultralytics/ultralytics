# Lane B S detector with the trunk from the P2-P5 parameter-matched Lane A classifier.

nc: 80
scales:
  s: [1.0, 1.0, 512]
scale_args:
  s: { ndl: 3, efficient_ms: false }

backbone:
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [48, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [5, true, 1.0e-05, true]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.5, true, 1.0e-05, true]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.175, true, 1.0e-05, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 4, true, 1.0e-05, false, 64, false, true, true, true, 4]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, true]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, true]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, true, 0.5, true]]
  - [
      [14, 17, 20],
      1,
      RTDETRDecoderEfficient,
      [nc, 256, 300, 4, 8, ndl, 2048, 0.0, silu, -1, 100, 0.5, 1.0, false, false, 0, efficient_ms, unshared, silu],
    ]
