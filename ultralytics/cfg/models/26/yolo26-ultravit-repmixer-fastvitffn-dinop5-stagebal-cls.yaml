# Lane A classifier for the DINO-P5 backbone, stage-balanced scaling. Rows 0-8 match
# yolo26-ultravit-repmixer-fastvitffn-dinop5-stagebal.yaml, its detector twin, which carries the derivation.
# max_channels still bounds the head's final C3k2 in the detector, so the caps here are the detector's rather than
# anything this classifier needs, keeping the distilled backbone byte-identical across the two.

nc: 1000

scales:
  # [depth, width, max_channels]
  # depth sets P5 blocks via round(3 * depth): 1 at n, s, m and l, 2 at x.
  n: [0.11, 0.25, 1024]
  s: [0.11, 0.50, 1024]
  m: [0.35, 0.6666666666666666, 768]
  l: [0.35, 0.75, 848]
  x: [0.50, 1.00, 768]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 P1/2 stem
  - [-1, 1, Conv, [152, 3, 2]] # 1 P2/4 stem
  - [-1, 9, RepUltraViTBlock, [3, True, 0.00001, True]] # 2 stage1 P2/4
  - [-1, 1, Conv, [352, 3, 2]] # 3 P3/8 downsample
  - [-1, 9, RepUltraViTBlock, [3, True, 0.00001, True]] # 4 stage2 P3/8
  - [-1, 1, Conv, [672, 3, 2]] # 5 P4/16 downsample
  - [-1, 8, RepUltraViTBlock, [3, True, 0.00001, True]] # 6 stage3 P4/16
  - [-1, 1, Conv, [768, 3, 2]] # 7 P5/32 downsample
  - [-1, 3, MHSABlock, [0, 8.5, True, 0.00001, False, 64, False, True, True, True, 4]] # 8 stage4 P5/32 dinop5

# Head
head:
  - [-1, 1, Classify, [nc]] # 9 AdaptiveAvgPool + Conv1x1 + Linear
