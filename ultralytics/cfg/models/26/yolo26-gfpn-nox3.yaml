# YOLO26 with the GiraffeNeckV2 neck minus the x3 node
# Ablation of yolo26-gfpn.yaml: the P5 intermediate node (merge_3) is dropped, so both of its consumers
# fall back to the raw backbone P5, while the x4 -> P5 and x7 -> P5 downsample paths are kept.
# The P5 output therefore fuses raw P5 with two downsampled P4-level nodes instead of the x3 node.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26-gfpn-nox3n.yaml' will call yolo26-gfpn-nox3.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# GiraffeNeckV2 neck without the x3 node
head:
  # node x4 (P4 intermediate): cat(x1, down(x2), up(P5))
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 up P5 -> P4
  - [4, 1, Conv, [512, 3, 2]] # 12 down backbone P3 -> P4 (bu_conv24)
  - [[11, 6, 12], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [512, True]] # 14 merge_4 -> x4

  # node x5 (P3 out): cat(x2, up(x4))
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 up x4 -> P3
  - [[-1, 4], 1, Concat, [1]] # 16
  - [-1, 2, C3k2, [256, True]] # 17 merge_5 -> x5 (P3/8-small)

  # node x7 (P4 out): cat(x4, down(x5))
  - [-1, 1, Conv, [256, 3, 2]] # 18 down P3out -> P4 (bu_conv57)
  - [[-1, 14], 1, Concat, [1]] # 19
  - [-1, 2, C3k2, [512, True]] # 20 merge_7 -> x7 (P4/16-medium)

  # node x6 (P5 out): cat(P5, down(x4), down(x7))
  - [14, 1, Conv, [512, 3, 2]] # 21 down x4 -> P5 (bu_conv46)
  - [20, 1, Conv, [512, 3, 2]] # 22 down x7 -> P5 (bu_conv76)
  - [[10, 21, 22], 1, Concat, [1]] # 23
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 merge_6 -> x6 (P5/32-large)

  - [[17, 20, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
