# Classifier twin of yolo26m-ultravit-040826-1, backbone identical.

nc: 1000

scales:
  m: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [4.25, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 4.75, True, 0.00001, False, 64]]

head:
  - [-1, 1, Classify, [nc]]
