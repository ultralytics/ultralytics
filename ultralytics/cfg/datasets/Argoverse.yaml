# Argoverse-HD dataset (ring-front-center camera) by Argo AI: https://www.cs.cmu.edu/~mengtial/proj/streaming/
# Documentation: https://docs.ultralytics.com/datasets/detect/argoverse
# Example usage: yolo train data=Argoverse.yaml
# Download: https://platform.ultralytics.com/ultralytics/datasets/argoverse (requires ULTRALYTICS_API_KEY)
# parent
# ├── ultralytics
# └── datasets
#     └── Argoverse ← existing local dataset

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: Argoverse # dataset root dir
train: Argoverse-1.1/images/train/ # train images (relative to 'path') 39384 images
val: Argoverse-1.1/images/val/ # val images (relative to 'path') 15062 images
test: Argoverse-1.1/images/test/ # test images (optional) https://eval.ai/web/challenges/challenge-page/800/overview

# Classes
names:
  0: person
  1: bicycle
  2: car
  3: motorcycle
  4: bus
  5: truck
  6: traffic_light
  7: stop_sign

# Download script/URL (optional) ---------------------------------------------------------------------------------------
download: |
  from ultralytics.data.utils import check_det_dataset, convert_ndjson_to_yolo_if_needed

  data = convert_ndjson_to_yolo_if_needed("https://platform.ultralytics.com/ultralytics/datasets/argoverse")
  yaml.update(check_det_dataset(data))
