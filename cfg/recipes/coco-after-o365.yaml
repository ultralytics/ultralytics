# COCO detection fine-tune for a backbone that already did the Objects365v1 150ep pretrain.
# Identical to coco-adapt except the epoch ladder matches the published post-objv1 COCO stage,
# so images seen align with the shipped pipeline. NOT epoch-comparable to coco-adapt reference
# arms, and the n entry aligns epochs only (the published n recipe is an independent tune).
# source: cfg/recipes/coco-adapt.yaml, _epochs_by_scale n300/s120/m100/l90/x70 -> n245/s70/m80/l60/x40
# _aug_by_scale applies the published yolo26 COCO det mixup/copy_paste/scale ladder (base row = s tier).
_epochs_by_scale: { n: 245, s: 70, m: 80, l: 60, x: 40 }
_aug_by_scale:
  n: { mixup: 0.01216, copy_paste: 0.07504, scale: 0.56232 }
  s: {}
  m: { mixup: 0.42713, copy_paste: 0.30413, scale: 0.95 }
  l: { mixup: 0.42713, copy_paste: 0.40413, scale: 0.95 }
  x: { mixup: 0.42713, copy_paste: 0.40413, scale: 0.95 }
auto_augment: randaugment
backbone_lr_ratio: 1.0
batch: 64
box: 9.83241
close_mosaic: 10
cls: 0.64896
copy_paste: 0.40413
copy_paste_mode: flip
cos_lr: false
cutmix: 0.00082
degrees: 0.00012
dfl: 0.95824
end2end: true
erasing: 0.4
fliplr: 0.30393
hsv_h: 0.01315
hsv_s: 0.35348
hsv_v: 0.19383
imgsz: 640
kobj: 1.0
lr0: 0.0005
lrf: 0.5
mixup: 0.05
momentum: 0.9
mosaic: 0.99182
nbs: 64
optimizer: AdamW
patience: 100
pose: 12.0
scale: 0.9
shear: 0.00136
translate: 0.27484
warmup_bias_lr: 0.0
warmup_epochs: 0.0
warmup_momentum: 0.9
weight_decay: 0.000125
