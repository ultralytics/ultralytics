name: Debug OpenVINO
on:
  push:
    branches: [fix-links-openvino]
jobs:
  Test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-latest, ubuntu-latest, ubuntu-latest, ubuntu-latest, ubuntu-latest, macos-26, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install --system -e ".[export-base]" pytest --torch-backend cpu
      - shell: bash
        run: lscpu 2>/dev/null | grep -E "Model name" || sysctl -n machdep.cpu.brand_string || true
      - shell: bash
        run: |
          set +e
          PYTHONFAULTHANDLER=1 python -m pytest -q -s --slow -p no:cacheprovider tests/test_exports.py -k "openvino" > out.log 2>&1
          echo "RESULT rc=$? $(tail -1 out.log)"
          grep -E "FAILED|Segmentation" out.log | head
