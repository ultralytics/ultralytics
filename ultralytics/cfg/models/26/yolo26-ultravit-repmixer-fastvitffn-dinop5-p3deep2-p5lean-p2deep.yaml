# p3deep2-p5lean with P2 raw repeats 5 to 8 and nothing else. P2 was the one stage the parent left under
# the conv floor. By params this arm reaches 1.54 n, 1.31 s, 1.11 m, 0.71 l, 1.03 x against that floor.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]. Resolved blocks P2/P3/P4/P5: 2/3/2/1 n, 2/3/2/1 s, 2/3/3/1 m, 2/3/3/1 l, 3/5/4/2 x
  n: [0.20, 0.25, 1024]
  s: [0.20, 0.50, 1152]
  m: [0.25, 1.00, 512]
  l: [0.24, 1.00, 768]
  x: [0.36, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 8, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 13, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 11, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 5, MHSABlock, [0, 4, True, 0.00001, False, 64, False, True, True, True, 4]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
