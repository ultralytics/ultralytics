# YOLO26 p4p5-wide with a GiraffeNeckV2 P3 injection added to the P4 top-down node
# Identical to yolo26-p4p5wide.yaml except that backbone P3 is also downsampled into the P4 top-down
# node, so stride-16 sees P3 detail without passing through the P3 node bottleneck. At these widths that
# node still only compresses 2.7:1, so unlike yolo26-p4p5-gfpn.yaml no x3 pre-fusion node is needed to
# absorb the extra input. The injection is depthwise to keep the added cost near zero.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, PSA, [1024]] # 10 partial attention

# YOLO26n head
head:
  # P4 top-down: cat(up(P5), backbone P4, down(backbone P3))
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 up P5 -> P4
  - [4, 1, DWConv, [512, 3, 2]] # 12 down backbone P3 -> P4 (bu_conv24)
  - [[11, 6, 12], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [768, True]] # 14 widened

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [384, True]] # 17 widened P3 intermediate (context only, no head)

  - [-1, 1, Conv, [384, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [768, True]] # 20 widened (P4/16)

  - [-1, 1, Conv, [768, 3, 2]] # 21
  - [[-1, 10], 1, Concat, [1]] # 22 cat backbone P5 direct
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[20, 23], 1, Detect, [nc]] # 24 Detect(P4, P5)
