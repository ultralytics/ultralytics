# Ultralytics RT-DETR DEIM config based on `deim_eupe_convnextsmall_l6_xl_c3k2Neck.yaml`.
# This variant swaps EUPE ConvNeXt-S for the larger EUPE ConvNeXt-B backbone.
# ConvNeXt-B keeps the ConvNeXt-S depths [3, 3, 27, 3] but widens dims 96/192/384/768 -> 128/256/512/1024,
# so P3/P4/P5 arrive at 256/512/1024 instead of 192/384/768.
# The YOLO26 Concat/C3k2 neck and the DEIMv2-X decoder are unchanged, so this isolates the backbone swap.
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes

backbone:
  # [from, repeats, module, args]
  # Semantic path (EUPE ConvNeXt-B).
  # Parser args: [out_ch, name, pretrained, out_indices, finetune, split]
  # EUPE ConvNeXt-B uses native P3/P4/P5 stage widths: 256/512/1024.
  - [-1, 1, DEIMEUPEConvNeXt, [None, eupe_convnext_base, True, [1, 2, 3], True, True]] # 0
  - [0, 1, Index, [256, 1]] # 1 semantic P3
  - [0, 1, Index, [512, 2]] # 2 semantic P4
  - [0, 1, Index, [1024, 3]] # 3 semantic P5

head:
  # YOLO26 FPN/PAN neck resolved at X scale (C3k2 widths 768/384/768/768, all repeats 1).
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, C3k2, [768, True]] # 6

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, C3k2, [384, True]] # 9 (P3/8-small)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 6], 1, Concat, [1]] # cat head P4
  - [-1, 1, C3k2, [768, True]] # 12 (P4/16-medium)

  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [768, True, 0.5, True]] # 15 (P5/32-large)

  # DeimDecoder (DEIMv2-X defaults explicitly set in YAML)
  # Args: [nc, hd, nq, ndp, nh, ndl, d_ffn, dropout, act, eval_idx, nd, label_noise_ratio, box_noise_scale,
  #        learnt_init_query, enable_cuda_acceleration, one_to_many_groups, dab_sine_embedding,
  #        efficient_msdeformable_attn, query_select_method, reg_max, reg_scale, layer_scale, mlp_act,
  #        o2m_topk_mode, use_gateway, share_bbox_head, share_score_head]
  - [[9, 12, 15], 1, DeimDecoder, [nc, 256, 300, [3, 6, 3], 8, 6, 2048, 0.0, "silu", -1, 100, 0.5, 1.0, False, False, 0, False, False, "default", 32, 4.0, 1.0, "silu", "unshared", True, False, False]]

loss:
  gamma: 1.5
  alpha: 0.75
  use_fl: False
  use_vfl: False
  use_mal: True
  use_union_set: True
  reg_max: 32
  loss_gain: {class: 1, bbox: 5, giou: 2, fgl: 0.15, ddf: 1.5}
  matcher:
    cost_gain: {class: 2, bbox: 5, giou: 2}
    use_fl: True
    alpha: 0.25
    gamma: 2.0
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 45
