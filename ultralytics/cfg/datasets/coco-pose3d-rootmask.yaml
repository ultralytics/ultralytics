# COCO-pose3d with the root joint marked unlabelled when it falls outside the image: `coco-pose3d-refocal` with
# one channel changed, by research/src/mask_root_vis.py. 10.4% of persons are affected. `Pose3DLoss` masks the
# root-depth term, the root location term and its objectness off that channel, so those persons now supervise
# 2D pose and relative depth only — not an absolute depth whose evidence is outside the picture.
# See research/experiments/h9-root-mask/ and H8, where root AbsRel rose 0.0398 -> 0.0456 as the frame-edge
# images entered training.
# Example usage: yolo train task=pose3d data=coco-pose3d-rootmask.yaml

path: /home/rick/coco-pose3d-rootmask # depths unchanged from coco-pose3d-refocal; only root visibility moves
train: train2017.txt
val: val2017.txt
test:

# Keypoints. Joints 0-16 are COCO-17 carrying root-relative depth; joint 17 is the root (mid-hip) and its depth
# channel holds the person's absolute depth. Both depth channels are encoded to [0, 1], see utils/pose3d.py.
kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas: [0.026, 0.025, 0.025, 0.035, 0.035, 0.079, 0.079, 0.072, 0.072, 0.062, 0.062, 0.107, 0.107, 0.087, 0.087, 0.089, 0.089, 0.107]

# Unchanged from coco-pose3d-refocal: every depth is keyed to focal = 1.2 * max(w, h).
focal_ratio: 1.2

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
