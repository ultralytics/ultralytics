# YOLO26 with P4/16 - P5/32 outputs at the original yolo26 neck widths, plus a narrow P3 injection
# P3 detection head is removed; P3 stays in the neck as context only. Backbone P3 is projected down to
# a quarter width before entering the P4 top-down node, which keeps that node at 3.2:1 instead of the
# 4:1 a full-width injection would force, so the top-down carrier is not displaced and no x3 node is
# needed to compensate. The P5 output keeps its direct path to the backbone.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, PSA, [1024]] # 10 partial attention

# YOLO26n head
head:
  # P4 top-down: cat(up(P5), backbone P4, narrow down(backbone P3))
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 up P5 -> P4
  - [4, 1, Conv, [128, 3, 2]] # 12 down backbone P3 -> P4, quarter width (bu_conv24)
  - [[11, 6, 12], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 P3 intermediate (context only, no head)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 10], 1, Concat, [1]] # 22 cat backbone P5 direct
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[20, 23], 1, Detect, [nc]] # 24 Detect(P4, P5)
