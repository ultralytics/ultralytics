# YOLO27-S with selective narrow-P2 detail and poly-kernel P5 context.

nc: 80
end2end: True
reg_max: 1
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  - [2, 1, Conv, [64, 3, 2]]
  # LSKNet Sections 3.2-3.3 and source lines 35-79: spatially select sequential 5x5 and dilated 7x7
  # depthwise contexts on the narrow projected P2 path before it enters the full-depth P3 refinement.
  # https://openaccess.thecvf.com/content/ICCV2023/papers/Li_Large_Selective_Kernel_Network_for_Remote_Sensing_Object_Detection_ICCV_2023_paper.pdf#page=4
  # https://github.com/zcablii/LSKNet/blob/8214a95cf782a4361cbec5368f4921e37785575e/mmrotate/models/backbones/lsknet.py#L35-L79
  - [-1, 1, LSKAttention, [64]]
  - [14, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 4, 16], 1, Concat, [1]]
  - [-1, 3, C3k2, [384, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  # PKINet Sections 3.2-3.3 and source lines 142-209: sum undilated 3/5/7/9/11 depthwise contexts,
  # then use pooled 11x1 and 1x11 context-anchor attention at P5 to protect medium/large recognition.
  # https://openaccess.thecvf.com/content/CVPR2024/papers/Cai_Poly_Kernel_Inception_Network_for_Remote_Sensing_Detection_CVPR_2024_paper.pdf#page=4
  # https://github.com/PKINet/PKINet/blob/c2ee525025a330b9a943be9b791d99017837b325/mmrotate/models/backbones/pkinet.py#L142-L209
  - [-1, 1, PKIContext, [1024, 0.5]]
  - [[20, 23, 27], 1, Detect, [nc]]
