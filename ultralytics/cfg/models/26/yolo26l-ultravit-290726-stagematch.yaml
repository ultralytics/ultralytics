# L-only P2-P5 YOLO26 stage-matched depth arm with the production detector head unchanged.

nc: 80
end2end: True
reg_max: 1

scales:
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.375, True, 0.00001, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.5, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [2.0625, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 2.25, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
