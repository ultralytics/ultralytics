# X-only backbone keeping Attn2 P2-P3 and matching Attn2 P4-P5 with fewer P4 blocks and a plain token MLP at P5.

nc: 80
end2end: True
reg_max: 1

scales:
  x: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 1, Conv, [144, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3.0, True, 0.00001, True]]
  - [-1, 1, Conv, [288, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3.0, True, 0.00001, True]]
  - [-1, 1, Conv, [576, 3, 2]]
  - [-1, 4, RepUltraViTBlock, [5.305556, True, 0.00001, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 3, MHSABlock, [0, 4.041667, True, 0.00001, False, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [384, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
