# Lane A DINO-P5 depth control. Matches FastViT-FFN + Attn2 P5 depth while retaining DINO-P5 token SwiGLU,
# head_dim 64, biased qkv/projection, four storage tokens, and no convolutional FFN.
# Backbone rows 0-8 match yolo26-ultravit-repmixer-fastvitffn-dinop5-depthmatched.yaml.

nc: 1000

scales:
  # [depth, width, max_channels]
  n: [0.20, 0.25, 1024]
  s: [0.20, 0.50, 1152]
  m: [0.25, 1.00, 512]
  l: [0.35, 1.00, 512]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 8, MHSABlock, [0, 4, True, 0.00001, False, 64, False, True, True, True, 4]]

head:
  - [-1, 1, Classify, [nc]]
