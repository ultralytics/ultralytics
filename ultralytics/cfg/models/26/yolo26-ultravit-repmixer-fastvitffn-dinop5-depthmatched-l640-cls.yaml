# Lane A classifier for the depth-matched DINO-P5 backbone, l640 scale retune. Rows 0-8 match
# yolo26-ultravit-repmixer-fastvitffn-dinop5-depthmatched-l640.yaml, its detector twin.
# l trades trunk depth for a wider P5, widened through max_channels rather than width, which would
# scale the classifier head too.
# n and s keep both P5 attention blocks and pay with max_channels, since cutting depth there drops to one
# block and reproduces dinop5 exactly. m and x are unchanged.

nc: 1000

scales:
  # [depth, width, max_channels]
  n: [0.20, 0.25, 768]
  s: [0.20, 0.50, 1024]
  m: [0.25, 1.00, 512]
  l: [0.24, 1.00, 640]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 8, MHSABlock, [0, 4, True, 0.00001, False, 64, False, True, True, True, 4]]

head:
  - [-1, 1, Classify, [nc]]
