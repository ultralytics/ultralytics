# Classifier twin of the X plain-token-MLP backbone with the wider P2 feed-forward layer.

nc: 1000

scales:
  x: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 1, Conv, [144, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [4.0, True, 0.00001, True]]
  - [-1, 1, Conv, [288, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3.0, True, 0.00001, True]]
  - [-1, 1, Conv, [576, 3, 2]]
  - [-1, 4, RepUltraViTBlock, [5.305556, True, 0.00001, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 3, MHSABlock, [0, 4.041667, True, 0.00001, False, 64]]

head:
  - [-1, 1, Classify, [nc]]
