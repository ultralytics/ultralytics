# YOLO26 P4/16 - P5/32 GiraffeNeckV2 variant with a dense P3 injection conv
# Identical to yolo26-p4p5-gfpn.yaml except that the backbone P3 downsample feeding the P4 top-down node
# is a dense conv instead of a depthwise one, matching yolo26-gfpn.yaml. This gives the injection a full
# cross-channel projection of P3 rather than a per-channel spatial reduction.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, PSA, [1024]] # 10 partial attention

# YOLO26n head
head:
  # node x3 (P5 intermediate): cat(P5, down(P4)) -- enriches the top-down carrier only
  - [6, 1, Conv, [512, 3, 2]] # 11 down backbone P4 -> P5 (bu_conv13)
  - [[10, 11], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [1024, True]] # 13 merge_3 -> x3

  # P4 top-down: cat(up(x3), backbone P4, down(backbone P3))
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 up x3 -> P4
  - [4, 1, Conv, [512, 3, 2]] # 15 down backbone P3 -> P4 (bu_conv24), dense
  - [[14, 6, 15], 1, Concat, [1]] # 16
  - [-1, 2, C3k2, [512, True]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 20 P3 intermediate (context only, no head)

  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 17], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 23 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 24
  - [[-1, 10], 1, Concat, [1]] # 25 cat backbone P5 direct
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 26 (P5/32-large)

  - [[23, 26], 1, Detect, [nc]] # 27 Detect(P4, P5)
