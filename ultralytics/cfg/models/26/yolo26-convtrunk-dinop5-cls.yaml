# Classifier twin of yolo26-convtrunk-dinop5.yaml, carrying the det-aligned SPPF at index 9 so rows 0-10
# match name-for-name and the distilled P5 attention transfers.

# Parameters
nc: 1000 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 det-aligned
  - [-1, 2, MHSABlock, [0, 4, True, 0.00001, False, 64, False, True, True, True, 4]] # 10 dinop5 attention

head:
  - [-1, 1, Classify, [nc]] # Classify
