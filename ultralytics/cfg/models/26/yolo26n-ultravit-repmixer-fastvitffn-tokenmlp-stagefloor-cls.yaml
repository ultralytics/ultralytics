# Classifier twin of the N-only plain-token-MLP stage-floor backbone.

nc: 1000

scales:
  n: [0.20, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 8, RepUltraViTBlock, [2.0, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 13, RepUltraViTBlock, [3.166667, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 8, RepUltraViTBlock, [4.916667, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 5, MHSABlock, [0, 4.34375, True, 0.00001, False, 64]]

head:
  - [-1, 1, Classify, [nc]]
