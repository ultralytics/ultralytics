# Ultralytics YOLO27 semantic segmentation model with P3/8 and P4/16 head inputs
# Model docs: https://docs.ultralytics.com/models/yolo27
# Task docs: https://docs.ultralytics.com/tasks/semantic
# The neck dams upsampled features with SNI x0.5 (Scale) before fusion, and the backbone P3
# stage C3k2 expansion is per-scale via the `bbp3e` scales arg: the 4th element of a scales
# entry is a dict of named values referenced by name in layer args (see backbone layer 4).

# Parameters
nc: 19 # number of classes (Cityscapes default)
scales: # model compound scaling constants, i.e. 'model=yolo27n-sem.yaml' will call yolo27-sem.yaml with scale 'n'
  # [depth, width, max_channels, {named per-scale args}]
  n: [0.50, 0.25, 1024, {bbp3e: 0.5}] # summary: 135 layers, 1,965,222 parameters, 1,965,222 gradients, 6.5 GFLOPs
  s: [0.50, 0.50, 1024, {bbp3e: 0.5}] # summary: 135 layers, 7,827,750 parameters, 7,827,750 gradients, 25.4 GFLOPs
  m: [0.50, 1.00, 512, {bbp3e: 0.25}] # summary: 155 layers, 16,130,406 parameters, 16,130,406 gradients, 75.2 GFLOPs
  l: [1.00, 1.00, 512, {bbp3e: 0.25}] # summary: 253 layers, 19,946,598 parameters, 19,946,598 gradients, 94.4 GFLOPs
  x: [1.00, 1.50, 512, {bbp3e: 0.25}] # summary: 253 layers, 44,831,366 parameters, 44,831,366 gradients, 211.5 GFLOPs

# YOLO27n-sem backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, bbp3e]] # 4 backbone P3 stage: e=0.5 at n/s, 0.25 at m/l/x
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO27n-sem head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # 12 SNI damping
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [768, True]] # 14 widened intermediate P4/16 (top-down)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # 16 SNI damping
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [384, True]] # 18 widened P3/8-small

  - [[18, 14], 1, SemanticSegment, [nc]] # SemanticSegment(P3, P4 top-down aux)
