# Lane A DINO-P5 detector, one yaml for n through x. Every P stage beats both lanes' baselines at every scale, paid
# for by cutting P4 repeats 20 to 8 and P5 repeats 8 to 3 and widening P2 and P3 instead.
# max_channels bounds the head's final C3k2 as well as P5, so it cannot be lowered to trim P5 alone.
# Divisibility: P5 needs a multiple of 64, that head C3k2 a multiple of 128.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  # depth sets P5 blocks via round(3 * depth): 1 at n, s, m and l, 2 at x.
  n: [0.11, 0.25, 1024]
  s: [0.11, 0.50, 1024]
  m: [0.35, 0.6666666666666666, 768]
  l: [0.35, 0.75, 848]
  x: [0.50, 1.00, 768]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 P1/2 stem
  - [-1, 1, Conv, [152, 3, 2]] # 1 P2/4 stem
  - [-1, 9, RepUltraViTBlock, [3, True, 0.00001, True]] # 2 stage1 P2/4
  - [-1, 1, Conv, [352, 3, 2]] # 3 P3/8 downsample
  - [-1, 9, RepUltraViTBlock, [3, True, 0.00001, True]] # 4 stage2 P3/8
  - [-1, 1, Conv, [672, 3, 2]] # 5 P4/16 downsample
  - [-1, 8, RepUltraViTBlock, [3, True, 0.00001, True]] # 6 stage3 P4/16
  - [-1, 1, Conv, [768, 3, 2]] # 7 P5/32 downsample
  - [-1, 3, MHSABlock, [0, 8.5, True, 0.00001, False, 64, False, True, True, True, 4]] # 8 stage4 P5/32 dinop5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10
  - [-1, 2, C3k2, [512, True]] # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [256, True]] # 14 P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16
  - [-1, 2, C3k2, [512, True]] # 17 P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 20 P5/32
  - [[14, 17, 20], 1, Detect, [nc]] # 21
