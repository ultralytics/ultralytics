# YOLO27-S with a 0.75-width MCI0-style 2:6:10:2 backbone and the two-level YOLO27 head.

nc: 80
end2end: True
reg_max: 1
scales:
  s: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [24, 3, 2]]
  - [-1, 1, Conv, [48, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3.0, True, 0.00001, True]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 6, RepUltraViTBlock, [3.0, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 10, RepUltraViTBlock, [3.0, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 1, MHSABlock, [0, 3.0, True, 0.00001, True, 64, False, False, False, False, 0, True]]
  - [-1, 1, MHSABlock, [0, 3.0, True, 0.00001, True, 64]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [384, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [192, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, C3k2, [384, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [[20, 23], 1, Detect, [nc]]
