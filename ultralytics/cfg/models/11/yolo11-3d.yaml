# Ultralytics YOLO11 lightweight Mono3D model with P3/8 - P5/32 outputs
# Detect3D uses direct log-depth, decoupled geometry/MultiBin towers and training-only projected-corner supervision.
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
reg_max: 16 # DFL channels
scales: # model compound scaling constants, i.e. 'model=yolo11n-3d.yaml' will call yolo11-3d.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, ~3.6M parameters, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, ~10.8M parameters, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, ~21.5M parameters, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, ~26.2M parameters, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, ~58.2M parameters, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect3D, [nc]] # Detect3D(P3, P4, P5)
