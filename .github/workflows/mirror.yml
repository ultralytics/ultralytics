name: Validate Windows OpenVINO fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 43944221ca14546e87dce6f5eb2e26269684aaff
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: "3.13"
      - run: uv pip install --system -e . openvino==2026.4.0 pytest pytest-cov pytest-xdist --torch-backend cpu
      - name: Run existing OpenVINO regression tests and native backend smoke
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          import openvino as ov
          from ultralytics import YOLO, settings
          repo = Path.cwd()
          print("CPU:", ov.Core().get_property("CPU", "FULL_DEVICE_NAME"), flush=True)
          assert "ONEDNN_MAX_CPU_ISA" not in os.environ
          directory = tempfile.mkdtemp()
          settings.update({"weights_dir": str(Path(directory, "weights"))})
          subprocess.run([sys.executable, "-m", "pytest", "-q", str(repo / "tests/test_exports.py") + "::test_export_openvino", "--export-env", "base"], cwd=directory, check=True)
          os.chdir(directory)
          source = Path(YOLO("yolo26n.pt").ckpt_path).resolve()
          for dynamic in [False, True]:
              for quantize in [None, 16]:
                  for nms in [None, False]:
                      # Fresh export directories keep Windows compiled-model file locks isolated.
                      subdir = Path(directory, f"{dynamic}-{quantize}-{nms}")
                      subdir.mkdir()
                      os.chdir(subdir)
                      shutil.copyfile(source, subdir / "yolo26n.pt")
                      path = YOLO(str(subdir / "yolo26n.pt")).export(format="openvino", imgsz=32, dynamic=dynamic, quantize=quantize, nms=nms)
                      model = YOLO(path)
                      model(str(repo / "ultralytics/assets/bus.jpg"), imgsz=64 if dynamic else 32)
                      backend = model.predictor.model.backend
                      assert backend.ov_compiled_model.get_property("INFERENCE_PRECISION_HINT") == ov.Type.f32
                      print("BACKEND PASS", dynamic, quantize, nms, flush=True)
                      del model
