# Enterprise 21-source pretrain, S scale p4p5 detectors. Partially labeled side of the ablation.
# Shares optimization and augmentation args with enterprise-o365-control. Its epoch-denominated keys are rescaled
# for a 1.93x bigger epoch:
# 78 epochs matches images seen (150 x 608,606 / 1,174,087), warmup and close_mosaic halve to match update counts.
# Compare checkpoints at Enterprise epoch = 0.518 x O365 epoch.
# backbone_lr_ratio 1.0 matches the control, see its header.
# patience is deliberately above both arms' epoch counts, so early stopping can never fire on either side.
auto_augment: randaugment
backbone_lr_ratio: 1.0
batch: 128
box: 7.5
close_mosaic: 5
cls: 0.5
cls_pw: 0.0
copy_paste: 0.0
cos_lr: false
cutmix: 0.0
degrees: 0.0
dfl: 6.0
dis: 6.0
erasing: 0.4
fliplr: 0.5
flipud: 0.0
grad_clip: 1.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
imgsz: 640
kobj: 1.0
lr0: 0.0005
lrf: 0.5
mixup: 0.05
momentum: 0.9
mosaic: 1.0
muon: 0.2
nbs: 64
optimizer: AdamW
patience: 200
perspective: 0.0
pose: 12.0
scale: 0.9
sgd: 1.0
shear: 0.0
translate: 0.1
warmup_bias_lr: 0.0
warmup_epochs: 0.14
warmup_momentum: 0.9
weight_decay: 0.000125
workers: 8
epochs: 78
quota_alpha: 0.7
repeat_t: 0.001
fed_k: 365
