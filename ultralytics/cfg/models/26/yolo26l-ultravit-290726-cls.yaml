# Classifier twin of the L-only plain-token-MLP stage-floor backbone.

nc: 1000

scales:
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [5.0625, True, 0.00001, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, RepUltraViTBlock, [7.40625, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3.203125, True, 0.00001, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, MHSABlock, [0, 6.28125, True, 0.00001, False, 64]]

head:
  - [-1, 1, Classify, [nc]]
