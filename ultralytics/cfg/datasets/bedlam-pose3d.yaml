# BEDLAM-pose3d: synthetic sequences with exact per-frame camera intrinsics, converted by
# research/src/convert_bedlam.py. This is the metric-scale half of the training data — the only source with
# real camera geometry at scale, which is what root depth needs and what no pseudo-label can supply.
# Example usage: yolo train task=pose3d data=bedlam-pose3d.yaml

path: /home/rick/bedlam-pose3d # dataset root; images/ are symlinks into the extracted BEDLAM tars
train: train.txt
val: # none — BEDLAM is training data; validate on the held-out 3DPW test split (3dpw-pose3d-r12.yaml)
test:

# Keypoints. Joints 0-16 are COCO-17 carrying root-relative depth; joint 17 is the root (mid-hip) and its depth
# channel holds the person's absolute depth. Both depth channels are encoded to [0, 1], see utils/pose3d.py.
#
# VISIBILITY IS TRI-STATE HERE, as COCO defines it, and this set is the reason:
#   0 = unlabelled            1 = labelled in 2D, depth unknown            2 = labelled in 2D and in depth
# BEDLAM's ground truth is the SMPL-X parameter set, not joints: `gtkps` is 2D only, and recovering
# root-relative depth would need the separately gated SMPL-X body model. So the seventeen COCO joints are
# written with visibility 1 and their depth channel holds the encoding of zero, which `Pose3DLoss` masks off —
# relative depth is supervised only where visibility is 2. The root is visibility 2: its absolute depth is
# real, taken from `cam_ext @ trans_world`. Every other writer in this project emits 2, so `== 2` and `!= 0`
# agree on them and nothing about COCO or 3DPW changes.
kpt_shape: [18, 4] # number of keypoints, number of dims (x, y, visible, z)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15, 17]
kpt_oks_sigmas: [0.026, 0.025, 0.025, 0.035, 0.035, 0.079, 0.079, 0.072, 0.072, 0.062, 0.062, 0.107, 0.107, 0.087, 0.087, 0.089, 0.089, 0.107]

# Declared, and re-keyed per frame rather than assumed. BEDLAM varies focal length by sequence (fx/max(w, h)
# runs ~0.78 on the 28 mm sequences), so every depth is multiplied by 1.2 * max(w, h) / fx at write time. That
# puts this set in the same unit as coco-pose3d-refocal and 3dpw-pose3d-trainval; mixing conventions would put
# two different metres on one regressor, which is the H6 failure.
focal_ratio: 1.2

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - root
