# DINO-P5 with RoPE-Mixed. The P5 block keeps 64-wide heads, biased QKV and projection,
# token SwiGLU, and four storage tokens. MixedRoPE2D is the only architectural change.
# Family s-x. Scale n is unsupported because its 288-wide P5 is not divisible by 64.

nc: 1000

scales:
  s: [0.20, 0.50, 1152]
  m: [0.25, 1.00, 512]
  l: [0.35, 1.00, 512]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 5, MixedRoPE2D, [0, 4, True, 0.00001, False, 64, True, True, True, 4]]

head:
  - [-1, 1, Classify, [nc]]
