# YOLO27-L neck and decoder with the FFN-Attn2 backbone reduced from 2/2/7/3 to 2/2/4/2 blocks.

nc: 80
scales:
  l: [1.0, 1.0, 512]
scale_args:
  l: { ndl: 4 }

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 4, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1152, 3, 2]]
  - [-1, 2, MHSABlock, [0, 4, True, 0.00001, True, 32]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]]
  - [
      [14, 17, 20],
      1,
      DeimDecoder,
      [
        nc,
        256,
        300,
        [3, 6, 3],
        8,
        ndl,
        2048,
        0.0,
        "silu",
        -1,
        100,
        0.5,
        1.0,
        False,
        False,
        0,
        False,
        False,
        "default",
        32,
        4.0,
        1.0,
        "silu",
        "unshared",
        True,
        False,
        False,
      ],
    ]
