# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# P4 detection head is removed; iso-FLOPs P3-capability upgrade of
# p3p5-correct-topdown-sni: the P3 head is widened to match backbone P3
# channels (both yaml-512 at every scale), funded by slimming the top-down P4
# intermediate (768->512), the second P4 intermediate (512->384) and the P5
# head (1024->768); a ScaledAdd zero-init residual from backbone P3 lets the
# head start as pure backbone passthrough.
# Motivation: the small-size P3 branch is starved (64-96 ch at n), which is
# why p4p5-n wins COCO but collapses on tiny-object fine-tuning; this
# strengthens P3 without adding inference compute.
# Should be trained/benchmarked with half_channel=True: the widened P3
# features are funded from the Detect head (c2/c3 halved) — at n this is
# 6.83G vs 7.48G base (-8.7%); without the flag it is over budget.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 backbone P3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # SNI damping
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14 top-down P4/16 intermediate, SLIMMED

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1, Scale, [0.5]] # SNI damping
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [512, True]] # 18 P3/8 head, WIDENED to backbone-P3 width
  - [[-1, 4], 1, ScaledAdd, []] # 19 zero-init residual from backbone P3

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat intermediate P4
  - [-1, 2, C3k2, [384, True]] # 22 intermediate P4/16, SLIMMED

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [768, True, 0.5, True]] # 25 (P5/32-large), SLIMMED

  - [[19, 25], 1, Detect, [nc]] # Detect(P3, P5)
