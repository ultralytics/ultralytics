# COCO human annotation restricted to the 1,168 val2017 images whose *teacher* labels survive
# `verify_image_label` — the same images, and the same 2,609 persons, the teacher ruler actually scores.
# Built by the snippet in analysis.md; labels are copies of /data/shared-datasets/coco-pose so the dataset
# cache stays private and the shared tree is never rewritten.
# This makes the two rulers directly comparable: same pixels, same people, only the annotator differs.

path: /home/rick/h7-surviving # dataset root dir
train:
val: val2017.txt
test:

# No `kpt_oks_sigmas`: [17, 3] selects OKS_SIGMA, the same ruler as every other H7 column.
kpt_shape: [17, 3]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes
names:
  0: person
