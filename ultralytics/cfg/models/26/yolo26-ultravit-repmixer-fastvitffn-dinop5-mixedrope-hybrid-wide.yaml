# Lane A detector for the DINO-P5 RoPE-Mixed backbone, depth-hybrid scaling. Rows 0-8 match
# yolo26-ultravit-repmixer-fastvitffn-dinop5-mixedrope-hybrid-wide-cls.yaml, its classifier twin.
# The capacity sibling of yolo26-ultravit-repmixer-fastvitffn-dinop5-mixedrope-hybrid.yaml, spending the
# latency margin both baselines leave at s and l. Only those two scales differ: the raw P5 arg rises to 1280, s
# caps at 1280 for a P5 of 640 rather than 576, and l caps at 768 rather than 640. n, m and x cap below either way
# and resolve to the plain hybrid's measured graphs. 704 and 832 are unavailable at l, the head's attention C3k2
# needs a multiple of 128. Neither widened cell is measured yet.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  # depth also sets the P5 attention block count via round(8 * depth): 1 at n and s, 2 at m and l, 3 at x.
  # n and s stay at 0.18 so they resolve to a single P5 block, the configuration that wins at those sizes.
  n: [0.18, 0.25, 1024]
  s: [0.18, 0.50, 1280]
  m: [0.25, 1.00, 512]
  l: [0.24, 1.00, 768]
  x: [0.35, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 20, RepUltraViTBlock, [3, True, 0.00001, True]]
  - [-1, 1, Conv, [1280, 3, 2]]
  - [-1, 8, MixedRoPE2D, [0, 4, True, 0.00001, False, 64, True, True, True, 4]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[14, 17, 20], 1, Detect, [nc]]
