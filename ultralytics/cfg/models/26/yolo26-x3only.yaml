# YOLO26 with only the GiraffeNeckV2 x3 node added to the baseline PAFPN neck
# Ablation of yolo26-gfpn.yaml: backbone P5 is pre-fused with a stride-2 conv of backbone P4 (merge_3 -> x3),
# and x3 replaces raw P5 as both the top-down source and the P5 output input. The P3 injection and the
# x4/x7 -> P5 downsample paths are not included, so the P5 fusion stays 2-way as in yolo26.yaml.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26-x3onlyn.yaml' will call yolo26-x3only.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head with the x3 node
head:
  # node x3 (P5 intermediate): cat(P5, down(P4))
  - [6, 1, Conv, [512, 3, 2]] # 11 down backbone P4 -> P5 (bu_conv13)
  - [[10, 11], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [1024, True]] # 13 merge_3 -> x3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 up x3 -> P4
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat x3
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 25 (P5/32-large)

  - [[19, 22, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
