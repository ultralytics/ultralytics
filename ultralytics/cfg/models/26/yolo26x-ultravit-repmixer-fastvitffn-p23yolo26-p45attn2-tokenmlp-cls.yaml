# Classifier twin of the X-only P2-P5 cross-baseline detector backbone.

nc: 1000

scales:
  x: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 1, Conv, [144, 3, 2]]
  - [-1, 2, RepUltraViTBlock, [5.0, True, 0.00001, True]]
  - [-1, 1, Conv, [288, 3, 2]]
  - [-1, 3, RepUltraViTBlock, [4.944445, True, 0.00001, True]]
  - [-1, 1, Conv, [576, 3, 2]]
  - [-1, 4, RepUltraViTBlock, [5.305556, True, 0.00001, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 2, MHSABlock, [0, 7.052084, True, 0.00001, False, 64, False, False, False, False, 0]]

head:
  - [-1, 1, Classify, [nc]]
